# Правила проектирования корпусных шкафов — распашных и купе (предложено).
# Редакция: 2026-11-23. Единицы: мм, если не указано иное.
# Источник правды для идентификаторов RW-<ДОМЕН>-NN. Метод: 00-method.md.
# Источники — 08-sources.md; конфликты, открытые данные, вопросы — 07-conflicts-and-questions.md.
# Проверка: python3 -I tools/check_rules.py
meta:
  title: Правила проектирования корпусных шкафов
  version: 2026-11-23
  status: предложено
  units: мм
  basis_tags:
    Н: норматив
    П: первичный документ производителя
    И: инженерная практика, расчёт или пакет AFABRIK
    Р: ориентир (форум, статья, магазин)
    "?": решение владельца (вопрос Q)
  domains:
    DIM: размеры и глубины
    CAR: корпус
    INT: зоны и штанги
    SHF: полки
    DRW: ящики
    SWG: распашные двери
    SLD: двери купе
    ANT: антресоль
    INS: установка, потолок, стены, крепление
    LAY: порядок проектирования
rules:

  # ===================== DIM: размеры и глубины =====================
  - id: RW-DIM-01
    title: "Глубина корпуса по боковине, задник вычитается из внутренней глубины"
    rule: "Глубину корпуса D_корп считать по боковине. Внутренняя глубина D_вн = D_корп − k_зад, где k_зад — сколько глубины занимает задняя стенка: ХДФ 4 в паз с отступом 16 — 20; ЛДСП 8 или 9 в четверть (выборка в боковинах с заднего края, стенка вровень с торцами) — 8 или 9; ЛДСП 16 между боковинами — 16 (вариант не подтверждён, Q-01). Накладная ХДФ на гвоздях не применяется. Полная глубина распашного шкафа D_полн = D_корп + t_фасада. Высоту, ширину и глубину считать отдельными цепями, как у кухни (R-DIM-01)."
    params:
      k_зад: {ХДФ_4_паз_отступ_16: 20, ЛДСП_8_четверть: 8, ЛДСП_9_четверть: 9, ЛДСП_16_между_боковинами: 16}
    calc:
      - {name: "D_вн при D_корп 580 и ХДФ в паз", expr: "D - k", vars: {D: 580, k: 20}, expect: 560}
      - {name: "D_вн при D_корп 580 и ЛДСП 8 в четверть", expr: "D - k", vars: {D: 580, k: 8}, expect: 572}
      - {name: "D_полн при D_корп 580 и фасаде 18", expr: "D + t", vars: {D: 580, t: 18}, expect: 598}
    basis: ["?", И]
    status: предложено
    src: [OW-01, KR-01]
    afabrik: [W05, W06]
    needs: [вариант задней стенки, толщина фасада]
    note: "Совпадает с решением по кухне (R-CAR-02, R-CAR-04) от 23.11.2026. Толщину ЛДСП в четверти (8 или 9) владелец проверит у поставщика."

  - id: RW-DIM-02
    title: "Глубина отделения для одежды на плечиках"
    rule: "Внутренняя глубина отделения со штангой вдоль шкафа — не менее 560 в зоне штанги (ГОСТ 13025.1-85, черт. 1 и 2). Для распашного шкафа отсюда D_корп ≥ 560 + k_зад: 580 при ХДФ в паз, 568–569 при ЛДСП 8–9 в четверть, 576 при ЛДСП 16. Предложение по умолчанию: D_корп 580 для всех вариантов задника, полная глубина с фасадом 18 — 598 (Q-02). Глубина под головные уборы — не менее 240 (п. 2.2)."
    params:
      D_вн_плечики_min: 560
      D_вн_головные_уборы_min: 240
      D_корп_распашной_предложено: 580
    calc:
      - {name: "D_корп min при ХДФ в паз", expr: "560 + k", vars: {k: 20}, expect: 580}
      - {name: "D_корп min при ЛДСП 9 в четверть", expr: "560 + k", vars: {k: 9}, expect: 569}
    basis: [Н, "?"]
    status: предложено
    src: [NR-01, ST-01]
    afabrik: [W01, W05]
    needs: [вариант задней стенки]
    note: "Практика СНГ называет полную глубину около 600 (ST-01) — с D_корп 580 и фасадом 18 это 598. Меньшая глубина — только с торцевой штангой (RW-DIM-04)."

  - id: RW-DIM-03
    title: "Глубина шкафа-купе и зона дверей"
    rule: "Общая глубина купе D_общ = D_вн + k_зад + Z_дв, где Z_дв — зона дверей: ширина верхней направляющей выбранной системы плюс зазор от створки до наполнения. Для двух полотен Z_дв около 100 (статьи; направляющие: Raumplus двойная 81, Aristo «Стандарт» 81,5, тройная Raumplus 120). Чтобы выполнить ГОСТ 560 за дверями, нужно D_общ ≥ 560 + 20 + 100 = 680 (при ХДФ в паз). Практика СНГ: 600 — минимум (внутри около 480), 650 — рекомендуемо (внутри около 530); это меньше ГОСТ (X-01). Глубину по умолчанию выбирает владелец (Q-03). Ящики, полки и штанга не заходят в зону дверей."
    params:
      Z_дв_две_створки: 100
      направляющая_верхняя: {raumplus_двойная: 81, aristo_стандарт: 81.5, raumplus_тройная: 120, raumplus_AIR_двойная: 85}
      направляющая_нижняя: {raumplus_двойная: 63, raumplus_врезная: 60, raumplus_тройная: 102}
      D_общ_практика: {min: 600, рекомендуемо: 650}
    calc:
      - {name: "D_общ по ГОСТ 560, ХДФ в паз, Z_дв 100", expr: "560 + k + z", vars: {k: 20, z: 100}, expect: 680}
      - {name: "D_вн при D_общ 650", expr: "D - k - z", vars: {D: 650, k: 20, z: 100}, expect: 530}
      - {name: "D_вн при D_общ 600", expr: "D - k - z", vars: {D: 600, k: 20, z: 100}, expect: 480}
    basis: [Н, П, Р, "?"]
    status: предложено
    src: [NR-01, RP-02, AR-01, ST-04, ST-08, ST-01]
    afabrik: [W09]
    needs: [система купе, число полотен, вариант задней стенки]
    note: "Плечики шириной около 450 помещаются и в 480–530, но одежда касается задней стенки или дверей; ГОСТ 560 — функциональный минимум. Z_дв уточнять по чертежу выбранной системы (адаптер RW-SLD-01)."

  - id: RW-DIM-04
    title: "Неглубокий шкаф: только торцевая штанга"
    rule: "Если внутренняя глубина меньше 560, продольную штангу не ставить: вешать одежду на торцевую (выдвижную) штангу поперёк шкафа. Минимальная внутренняя глубина под выдвижную штангу — по паспорту выбранной модели (у Hettich на направляющих Quadro — 350, нагрузка 25 кг). Практика: корпус 450–500 — только торцевая штанга."
    params:
      D_вн_выдвижная_штанга_hettich: 350
      нагрузка_кг: 25
    basis: [Н, П, Р]
    status: предложено
    src: [NR-01, HT-04, ST-11]
    afabrik: [W11]
    needs: [внутренняя глубина, модель штанги]
    note: "Данные Hettich взяты из поисковой выдачи карточки товара; перед заказом открыть паспорт (D-02). Выдвижную штангу ГОСТ 16371 проверяет отдельно: усилие ≤ 5 даН, прогиб после 20 000 циклов ≤ 5 мм."

  - id: RW-DIM-05
    title: "Высота шкафа и подъём при сборке лёжа"
    rule: "Шкаф, собранный лёжа, поднимают поворотом; при этом нужна высота sqrt(H² + D²). Условие: sqrt(H_корп² + D_корп²) ≤ H_пот − z, запас z = 30 (данные фабрики: при сборке в нише +30 по высоте). Отсюда H_корп ≤ sqrt((H_пот − z)² − D_корп²). Если не выполняется — собирать стоя или делить на корпус и антресоль (RW-ANT-02). Высоту потолка мерить в самой низкой точке места установки."
    params:
      z_запас_подъёма: 30
    calc:
      - {name: "H_max при потолке 2700, D 600", expr: "sqrt((P - z)**2 - D**2)", vars: {P: 2700, z: 30, D: 600}, expect: 2601.7}
      - {name: "проверка: диагональ 2600 × 600", expr: "sqrt(H**2 + D**2)", vars: {H: 2600, D: 600}, expect: 2668.3}
      - {name: "H_max при потолке 2500, D 580", expr: "sqrt((P - z)**2 - D**2)", vars: {P: 2500, z: 30, D: 580}, expect: 2400.94}
    basis: [И, Р]
    status: предложено
    src: [ST-02, ST-10]
    afabrik: []
    needs: [высота потолка в низшей точке, D_корп]
    note: "Запас 30 взят из техописания фабрики (поисковая выдача, ST-10); точное число не нормируется. Для купе с дверями до потолка корпус часто ниже, а щель закрывает фальш-панель (RW-INS-03)."

  - id: RW-DIM-06
    title: "Высота боковины одной деталью"
    rule: "Боковина делается из одного листа ЛДСП: H_боковины ≤ L_плиты − обрезка кромок плиты. При формате 2750×1830 — не более 2730 (обрезка 10 с каждой стороны); при 2800×2070 — не более 2780. Выше — корпус плюс антресоль (RW-ANT-02). Формат плиты подтверждать у поставщика (D-06)."
    params:
      плита: {2750x1830: 2750, 2800x2070: 2800}
      обрезка_на_сторону: 10
    calc:
      - {name: "боковина из плиты 2750", expr: "L - 2 * c", vars: {L: 2750, c: 10}, expect: 2730}
    basis: [И, Р]
    status: предложено
    src: [ST-12]
    afabrik: [W01]
    needs: [формат плиты поставщика]
    note: "Обрезка 10 на сторону — инженерное допущение (кромки плиты бывают повреждены); подтвердить у раскройного цеха."

  - id: RW-DIM-07
    title: "Допуски габаритов и зазоров (ГОСТ 16371-2014)"
    rule: "Предельные отклонения габарита: до 2000 включительно ±4; свыше 2000 до 3150 ±5 (п. 5.2.1, табл. 1). Зазор двери в проёме на сторону, если его не задаёт документация, не более 2,0; наружного ящика в проёме — не более 1,5 (п. 5.2.2). Покоробленность двери: длина > 600 и ширина < 600 — не более 1,2; обе стороны > 600 — не более 2,2 (п. 5.2.3)."
    params:
      габарит_до_2000: 4
      габарит_2000_3150: 5
      зазор_двери_max: 2.0
      зазор_ящика_max: 1.5
      покоробленность_двери: {длина_более_600_ширина_менее_600: 1.2, обе_более_600: 2.2}
    basis: [Н]
    status: предложено
    src: [NR-02]
    afabrik: []
    needs: []
    note: "Допуск габарита ±5 на высоте 2400–2700 учитывать в цепи «шкаф — ниша» (RW-INS-05)."

  # ===================== CAR: корпус =====================
  - id: RW-CAR-01
    title: "Материал корпуса и фасадов"
    rule: "Корпус всегда ЛДСП 16: боковины, крыша, дно, перегородки, полки по умолчанию. Фасады распашных дверей — 16, 18 и толще. ХДФ — только задняя стенка и дно ящика, не несущая деталь. Толщину не выбирать по пересечению диапазонов W01/W02 (C05)."
    params:
      t_корпус: 16
      t_фасад: [16, 18]
    basis: ["?", И]
    status: предложено
    src: [OW-01, AF-01]
    afabrik: [W01, W02, C01, C05]
    needs: [толщина фасада]
    note: "Уточнение владельца 23.11.2026 (OW-01). Полка 18 и толще — отдельное решение (Q-04); пролёт полки 16 ограничен (RW-SHF-03)."

  - id: RW-CAR-02
    title: "Задняя стенка шкафа"
    rule: "Варианты AFABRIK: (1) ХДФ 4 в пазу с отступом 16 от заднего края, k_зад 20; (2) ЛДСП 8 или 9 в четверти, вровень с задними торцами, k_зад 8 или 9; (3) ЛДСП 16 между боковинами на конфирматах, k_зад 16 (Q-01). Накладная ХДФ на гвоздях не применяется. Задняя стенка обязательна для высокого шкафа: она держит прямой угол корпуса. Для вариантов (1) и (2) крышу, дно и стационарную полку ставить так, чтобы паз или четверть проходили без разрыва."
    params:
      k_зад: {ХДФ_паз: 20, ЛДСП_8_четверть: 8, ЛДСП_9_четверть: 9, ЛДСП_16: 16}
    basis: ["?", И]
    status: предложено
    src: [OW-01, KR-01, NR-02]
    afabrik: [W05, W06]
    needs: [вариант задней стенки]
    note: "ГОСТ 16371-2014, п. 5.2.26: накладная задняя стенка не должна выступать за пласти боковин — для четверти это значит «вровень с торцами»."

  - id: RW-CAR-03
    title: "Прямоугольность корпуса до установки задника"
    rule: "Перед установкой задней стенки разница диагоналей корпуса не больше 5 мм на 1 м диагонали (практика сборщиков). Для корпуса 2400 × 1000 (диагональ около 2600) — не больше 13."
    params:
      разница_диагоналей_на_1м: 5
    calc:
      - {name: "допуск для корпуса 2400 × 1000", expr: "5 * sqrt(H**2 + W**2) / 1000", vars: {H: 2400, W: 1000}, expect: 13.0}
    basis: [Р]
    status: предложено
    src: [ST-02]
    afabrik: []
    needs: [габарит корпуса]
    note: "Нормативного числа не найдено; ориентир из статьи о сборке. Двери купе и распашные регулируются в небольших пределах, поэтому перекос сразу виден в зазорах."

  - id: RW-CAR-04
    title: "Ширина секции и перегородки"
    rule: "Ширину секции ограничивает её наполнение: секция с полками — не шире пролёта полки для её нагрузки (RW-SHF-03); секция со штангой — не шире пролёта штанги (RW-INT-06) или с промежуточной опорой; секция с пантографом — в диапазоне ширин модели (RW-INT-05); секция с ящиками в купе — не шире створки, которая её открывает (RW-DRW-04). Шире — ставить вертикальную перегородку ЛДСП 16. В купе перегородки ставить за стыками створок, чтобы каждая секция открывалась одной створкой."
    basis: [И]
    status: предложено
    src: [AF-01, ST-12]
    afabrik: [W11, W12]
    needs: [наполнение секций]
    note: "Вертикальная перегородка заодно служит опорой для полок и штанг."

  - id: RW-CAR-05
    title: "Основание: цоколь и опоры"
    rule: "Высота цоколя 40–100 (W03); опору выбирать вместе с цоколем (C06): регулируемая опора должна укладываться в высоту цоколя с запасом на регулировку. Пример Hettich Korrekt: цоколь 70 — регулировка 62–86, цоколь 80 — 74–110, цоколь 100 — 89–125, до 450 кг на опору. Под купе основание выставлять строго по уровню: нижняя направляющая лежит на дне, и перекос даёт самооткат створок."
    params:
      цоколь: [40, 100]
      hettich_korrekt: {70: [62, 86], 80: [74, 110], 100: [89, 125]}
    basis: [И, П]
    status: предложено
    src: [AF-01, HT-03]
    afabrik: [W03, W04, C06, C07]
    needs: [высота цоколя, модель опоры]
    note: "«NTEGRATO» и М6 из W04 не уточнены (C07); подбирать по паспорту выбранной опоры."

  # ===================== INT: зоны и штанги =====================
  - id: RW-INT-01
    title: "Отделение для длинной одежды"
    rule: "Высота от верха штанги до нижней границы отделения (дно, полка, ящик) — не менее 1400 (ГОСТ 13025.1-85, черт. 1). Рекомендовано 1500–1700 для пальто и длинных платьев (практика СНГ). Над штангой до полки — не менее 50 (RW-INT-03)."
    params:
      H_min: 1400
      H_рекомендовано: [1500, 1700]
    basis: [Н, Р]
    status: предложено
    src: [NR-01, ST-01, ST-03]
    afabrik: [W11]
    needs: [рост владельца одежды, тип одежды]
    note: "Источники расходятся: 1300 (ST-03), 1500–1700 (ST-01); ГОСТ даёт минимум 1400 (X-02)."

  - id: RW-INT-02
    title: "Отделение для короткой одежды и две штанги друг над другом"
    rule: "Высота отделения для короткой одежды (рубашки, пиджаки) — не менее 900 (ГОСТ 13025.1-85, черт. 2), рекомендовано 1000–1100. Две штанги друг над другом без пантографа: верх верхней штанги ≤ 1900 (RW-INT-04), под ней ≥ 900 до нижней штанги, под нижней ≥ 900 до дна. Отсюда верх нижней штанги в окне от h_дна + 900 до 1900 − 900 = 1000, где h_дна — высота верхней пласти дна от пола (цоколь + 16). При цоколе 60 окно 976–1000; при цоколе 100 — пусто, нужна верхняя штанга с пантографом."
    params:
      H_min: 900
      H_рекомендовано: [1000, 1100]
    calc:
      - {name: "окно нижней штанги при цоколе 60, дно 16", expr: "(1900 - 900) - (c + 16 + 900)", vars: {c: 60}, expect: 24}
      - {name: "окно при цоколе 100", expr: "(1900 - 900) - (c + 16 + 900)", vars: {c: 100}, expect: -16}
    basis: [Н, Р, И]
    status: предложено
    src: [NR-01, ST-01]
    afabrik: [W11]
    needs: [высота цоколя, наличие пантографа]
    note: "Источники для короткой одежды расходятся: 900 по ГОСТ, 1000–1100 в практике (X-03). Двойная штанга удобна при пантографе вверху (RW-INT-05)."

  - id: RW-INT-03
    title: "Штанга: положение по глубине и зазор до полки"
    rule: "От верха штанги до полки над ней — не менее 50 (ГОСТ 13025.1-85, черт. 1 и 2), чтобы снять плечики. Отделение над штангой под полкой — не менее 170 (п. 3.1). Ось продольной штанги — посередине внутренней глубины (крючок плечиков в центре, одежда не касается задника и дверей)."
    params:
      штанга_до_полки_min: 50
      над_штангой_min: 170
    calc:
      - {name: "ось штанги при D_вн 560", expr: "D / 2", vars: {D: 560}, expect: 280}
    basis: [Н, И]
    status: предложено
    src: [NR-01]
    afabrik: [W11]
    needs: [внутренняя глубина]
    note: "Число для оси штанги источники не дают; середина глубины — инженерное правило."

  - id: RW-INT-04
    title: "Предельная высота штанги и зона досягаемости"
    rule: "Верх штанги или рабочая поверхность верхнего крючка — не выше 1900 от пола (ГОСТ 13025.1-85, п. 2.3). Выше допускается только с пантографом (лифтом штанги). Выше 1900 размещать вещи редкого пользования (антресоль, RW-ANT-01)."
    params:
      H_штанги_max: 1900
    basis: [Н]
    status: предложено
