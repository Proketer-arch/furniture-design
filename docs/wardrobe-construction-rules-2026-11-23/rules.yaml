  - id: RW-INT-05
    title: "Пантограф (лифт штанги)"
    rule: "Пантограф подбирать по внутренней ширине секции и нагрузке выбранной модели: Hettich Duo Lift Basic — 600–830 или 830–1150, 10 кг; Häfele с демпфером — 560–950, 10 кг; Häfele Professional — 870–1190, 15 кг. Ширина секции вне диапазона — другая модель или перегородка. Высоту установки и вылет брать из паспорта; проверить, что опущенная штанга не задевает створку купе или распашную дверь."
