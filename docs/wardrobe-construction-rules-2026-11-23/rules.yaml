  - id: RW-INT-07
    title: "Отделение для обуви"
    rule: "Ботинки и туфли, лёжа или наклонно: глубина не менее 320, высота не менее 150; сапоги: глубина не менее 320, высота не менее 400; ширина на пару не менее 250, порознь — не менее 125 на каждую (ГОСТ 13025.1-85, табл. 5, п. 8.1)."
