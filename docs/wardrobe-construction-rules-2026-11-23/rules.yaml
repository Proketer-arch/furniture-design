  # ===================== SHF: полки =====================
  - id: RW-SHF-01
    title: "Норма прогиба полки и расчётные нагрузки"
    rule: "Прогиб свободно лежащей полки — не более 5 мм на 1 м длины, то есть L/200 (ГОСТ 16371-2014, п. 5.2.30, табл. 3). Расчётная равномерная нагрузка по назначению (ГОСТ 19882-91, п. 1.6): головные уборы и лёгкие вещи — 20 даН/м², бельё и посуда — 60, книги — 120. Испытание — 7 суток под нагрузкой, прогиб у передней кромки посередине (пп. 8.2–8.6)."
    params:
      прогиб_max: "L/200"
      q_даН_м2: {лёгкие: 20, бельё: 60, книги: 120}
    calc:
      - {name: "допустимый прогиб полки 800", expr: "L / 200", vars: {L: 800}, expect: 4}
    basis: [Н]
    status: предложено
    src: [NR-02, NR-03]
    afabrik: [W11]
    needs: [назначение полки]
    note: "Американский калькулятор Sagulator советует втрое строже (около 1,7 мм на 1 м, CA-01); принят ГОСТ (X-05)."

  - id: RW-SHF-02
    title: "Расчёт прогиба полки ЛДСП"
    rule: "Полку считать балкой на двух опорах под равномерной нагрузкой: f = 5·q·L⁴ / (384·E·I), I = b·t³/12, q = q_F·b. Глубина полки b сокращается: предельный пролёт от неё не зависит. Модуль упругости ЛДСП принимать E = 2500 МПа (консервативно), пока нет паспорта плиты (D-03). Расчёт — проверка проекта, не замена испытания; полка на конфирматах прогибается меньше, на полкодержателях — больше (RW-SHF-04)."
    params:
      E_МПа: 2500
    calc:
      - {name: "прогиб полки 16 × 800, бельё 60 даН/м², b 500 (меньше L/200 = 4)", expr: "5 * (q * 10e-6 * b) * L**4 / (384 * E * b * t**3 / 12)", vars: {q: 60, b: 500, L: 800, E: 2500, t: 16}, expect: 3.75}
      - {name: "прогиб полки 16 × 900, бельё (больше L/200 = 4,5)", expr: "5 * (q * 10e-6 * b) * L**4 / (384 * E * b * t**3 / 12)", vars: {q: 60, b: 500, L: 900, E: 2500, t: 16}, expect: 6.01}
    basis: [И]
    status: предложено
    src: [NR-02, NR-03, CA-01]
    afabrik: []
    needs: [толщина, нагрузка, модуль упругости плиты]
    note: "При E = 3500 МПа пролёты длиннее примерно на 12 %. Длительная ползучесть ДСП в расчёт не входит: для тяжёлых полок (книги) брать нижнюю строку таблицы RW-SHF-03."

  - id: RW-SHF-03
    title: "Предельный пролёт полки без опоры"
    rule: "Пролёт полки — по таблице расчёта в 03-interior.md (шаг 50, предел L/200, E 2500): ЛДСП 16 — лёгкие вещи 1150, бельё и одежда 800, книги 600; ЛДСП 18 — 1300, 900 и 700. Так как корпус и полки по умолчанию ЛДСП 16 (RW-CAR-01), секция с полками под бельё — не шире 800, под книги и обувь в коробках — не шире 600. Длиннее — промежуточная опора, перегородка или полка толще (Q-04)."
    params:
      ЛДСП_16: {лёгкие: 1150, бельё: 800, книги: 600}
      ЛДСП_18: {лёгкие: 1300, бельё: 900, книги: 700}
    basis: [И, Р, "?"]
    status: предложено
    src: [NR-02, NR-03, FR-01, FR-04]
    afabrik: [W11]
    needs: [назначение полки, толщина]
    note: "Практика СНГ близка к расчёту: форумы называют для 16 под книги до 600, под бельё 800–900 (FR-01, FR-04); статья — «не шире 600» (ST-01). Расхождения — X-04."

  - id: RW-SHF-04
    title: "Съёмная и жёсткая полка"
    rule: "Жёсткая полка (на конфирматах или эксцентриках) — связь корпуса: она прогибается меньше и держит боковины. Съёмная на полкодержателях — только опора; её пролёт брать по RW-SHF-03 без увеличения. В высоком шкафу без жёстких связей по высоте ставить хотя бы одну жёсткую полку или царгу примерно посередине высоты (W11)."
    basis: [И, Р]
    status: предложено
    src: [AF-01, FR-04]
    afabrik: [W11]
    needs: [тип полки]
    note: "Форум: полка 16 × 970 с 16 кг на полкодержателях — прогиб 7–9 мм, на конфирматах почти без прогиба (FR-04, поисковая выдача)."

  - id: RW-SHF-05
    title: "Стеклянные полки"
    rule: "Толщина стеклянной полки по длине: до 500 — 4; 500–650 — 5; 650–900 — 6 (ГОСТ 16371-2014, п. 5.2.8, табл. 2). Расчётная нагрузка на стеклянную полку — 25 даН/м² (ГОСТ 19882-91)."
    params:
      толщина_по_длине: {до_500: 4, до_650: 5, до_900: 6}
    basis: [Н]
    status: предложено
    src: [NR-02, NR-03]
    afabrik: []
    needs: [длина полки]
    note: "Стекло длиннее 900 — по отдельному расчёту и паспорту стекла."

  # ===================== DRW: ящики =====================
  - id: RW-DRW-01
    title: "Ящик — по адаптеру направляющих"
    rule: "Размеры ящика, зазоры и присадку брать из паспорта выбранных направляющих (W10), как у кухни: длина ящика NL — по внутренней глубине D_вн и минимальной глубине системы; бренды в одном узле не смешивать (R-SUP-01). В купе ящик и его ручка не заходят в зону дверей (RW-DIM-03)."
    basis: [П, И]
    status: предложено
    src: [AF-01, KR-01]
    afabrik: [W10]
    needs: [система направляющих]
    note: "Таблицы NL кухни посчитаны для кухонных глубин; в шкафу D_вн другая — пересчитывать."

  - id: RW-DRW-02
    title: "Высота установки ящиков"
    rule: "Верхняя кромка передней стенки верхнего ящика для белья — не выше 1250 от пола (ГОСТ 13025.1-85, п. 7). Высота фасада ящика в шкафу обычно 150–250, ширина ящика — до 800 (практика). Задний борт выдвижной полки или лотка — не ниже 30 (п. 3.3)."
    params:
      верх_ящика_max: 1250
      фасад_ящика: [150, 250]
      ширина_ящика_max: 800
      задний_борт_лотка_min: 30
    basis: [Н, Р]
    status: предложено
    src: [NR-01, ST-01]
    afabrik: [W10]
    needs: []
    note: "Ширина до 800 — практика; ограничение направляющих — по паспорту."

  - id: RW-DRW-03
    title: "Ящик за распашной дверью"
    rule: "Ящик внутри шкафа за распашной дверью не должен задевать открытую дверь и петлю. Решения по порядку: (1) петля 155° с нулевым вхождением — ящик выдвигается без проставки (Blum); ограничитель 92° гарантирует, что ящик не задевает дверь, 110° — защищает соседнюю ручку; (2) с петлёй 110° — проставка между боковиной и направляющей на величину вхождения двери и петли (вкладная петля Ferrari — плечо 17; форум — около 25 на сторону с дверью). Число проставки подтверждать макетом или каталогом петли (D-04)."
    params:
      плечо_вкладной_петли_ferrari: 17
      проставка_ориентир: 25
    basis: [П, Р]
    status: предложено
    src: [BL-02, MD-01, FR-05]
    afabrik: [W09, W10]
    needs: [петля, угол открывания, толщина двери]
    note: "Кухонное правило выбора петли (R-HNG-01, п. 4) действует и здесь. IKEA PAX с распашными дверями не ставит ящик в самый низ из-за петель."

  - id: RW-DRW-04
    title: "Ящики в шкафу-купе"
    rule: "Ящики в купе ставить только в секции, которая целиком открывается одной створкой; напротив вертикального профиля и стыка створок ящик не ставить («мёртвая зона»). Ящик уже секции: проставки 30–50 от боковин или ящик около 60 уже секции, чтобы ручка и короб не упирались в профиль открытой створки. Фасад ящика утоплен за зону дверей с зазором не менее 10 до створки."
    params:
      проставка: [30, 50]
      зазор_до_створки_min: 10
    calc:
      - {name: "ширина короба при секции 560 и проставках 30", expr: "S - 2 * p", vars: {S: 560, p: 30}, expect: 500}
    basis: [Р, И]
    status: предложено
    src: [ST-05, ST-12, FR-02]
    afabrik: [W09, W10]
    needs: [ширина секции, положение стыков створок]
    note: "Производители купе чисел не дают; проставки 30–50 и «на 60 уже» — статьи и форумы. Зазор 10 до створки — инженерное допущение."

  # ===================== SWG: распашные двери =====================
  - id: RW-SWG-01
    title: "Тип двери и выбор петли"
    rule: "Сначала выбрать наложение (накладная, вкладная) и наличие ящиков за дверью, затем петлю по кухонному порядку R-HNG-01 и таблице её зазоров. Петлю и планку брать одного производителя (R-SUP-01). Распашная дверь шире своей высоты не применяется (R-HNG-04)."
    basis: [И, П]
    status: предложено
    src: [KR-01, AF-01]
    afabrik: [W08, W09]
    needs: [тип наложения, толщина двери]
    note: "Отличие от кухни: двери высокие, поэтому число петель считать по RW-SWG-03."

  - id: RW-SWG-02
    title: "Ширина двери: модуль − 3"
    rule: "Накладная дверь на свой модуль (секцию): W_дв = W_модуля − 3 (1,5 на сторону, шов между дверями 3), как в кухне (R-DIM-07). Две двери на одну секцию: W_дв = (W − 6) / 2 (крайние 1,5 + средний шов 3). Высота накладной двери: H_дв = H_корп − 3, если дверь закрывает крышу и дно, с теми же 1,5. Проверка: шов не меньше двух минимальных зазоров выбранной петли."
    params:
      зазор_на_сторону: 1.5
      шов: 3
    calc:
      - {name: "одна дверь на секцию 600", expr: "W - 3", vars: {W: 600}, expect: 597}
      - {name: "две двери на секцию 900", expr: "(W - 6) / 2", vars: {W: 900}, expect: 447}
    basis: [И, П, Н]
    status: предложено
    src: [KR-01, MD-01, NR-02]
    afabrik: [C08]
    needs: [ширина модуля, петля]
    note: "МДМ (Ferrari): «фасад уже короба на 3 мм (1,5 + 1,5)». ГОСТ 16371 допускает до 2,0 на сторону (RW-DIM-07) — 1,5 укладывается (X-06)."

  - id: RW-SWG-03
    title: "Число петель на высокую дверь"
    rule: "Число петель — большее из двух: (1) по высоте двери при ширине до 600: до 900 — 2; до 1600 — 3; до 2000 — 4; до 2400 — 5; до 2600 — 6; до 2800 — 7 (нижние пороги Ferrari/МДМ, продолжение ряда Hettich); (2) по массе двери с ручкой по Blum (R-HNG-02): до 6 кг — 2, 6–12 — 3, 12–17 — 4, 17–22 — 5, 22–27 — 6, 27–32 — 7. Ширина 600–650 — плюс одна петля. Массу считать как у кухни (R-FRN-04): ЛДСП 700 кг/м³, МДФ 900 кг/м³."
    params:
      по_высоте: [[900, 2], [1600, 3], [2000, 4], [2400, 5], [2600, 6], [2800, 7]]
      по_массе_blum_кг: [[6, 2], [12, 3], [17, 4], [22, 5], [27, 6], [32, 7]]
    calc:
      - {name: "масса двери ЛДСП 16, 2350 × 447, кг", expr: "H * W * t * rho / 1e9", vars: {H: 2350, W: 447, t: 16, rho: 700}, expect: 11.77}
      - {name: "петли: по высоте 5, по массе 3", expr: "max(5, 3)", vars: {}, expect: 5}
    basis: [П]
    status: предложено
    src: [MD-01, HT-01, BL-01]
    afabrik: [W09]
    needs: [высота, ширина, масса двери]
    note: "Пороги высоты у производителей разные: Hettich 1000/1700/2200/2400/2600/2800, Ferrari 900/1600/2000/2400 (X-07); принят меньший порог — больше петель. Hettich советует пробную навеску."

  - id: RW-SWG-04
    title: "Расстановка петель"
    rule: "Крайние петли — на 100 от верхнего и нижнего края двери (K07; Hettich допускает 60–100), промежуточные — равномерно, расстояние между петлями не меньше 280. Расстояние между верхней и нижней петлёй больше ширины двери (Blum). Петля не должна совпадать по высоте с полкой, перегородкой или штангой — сдвигать петлю, а не наполнение."
    params:
      от_края: 100
      между_петлями_min: 280
    calc:
      - {name: "шаг 5 петель на двери 2350", expr: "(H - 2 * e) / (n - 1)", vars: {H: 2350, e: 100, n: 5}, expect: 537.5}
    basis: [П, И]
    status: предложено
    src: [HT-01, BL-03, AF-01]
    afabrik: [W09]
    needs: [высота двери, положение полок]
    note: "AFABRIK K07 задаёт 100 для кухни; база отсчёта (край фасада) та же."

  - id: RW-SWG-05
    title: "Высокая дверь: коробление и выпрямитель"
    rule: "Дверь длиннее 600 и шириной до 600 по ГОСТ может покоробиться до 1,2, шире 600 — до 2,2 (RW-DIM-07); у высокой двери из ЛДСП 16 это видно в шве. Предложение: дверь выше 2000 — ставить выпрямитель (Q-07). Выпрямитель Hettich рассчитан на фасад 18–30 и высоту до 2600, ставится два вертикально у наружной кромки; для фасада 16 подходящей модели не найдено (D-07)."
    params:
      hettich_выпрямитель: {фасад: [18, 30], высота_max: 2600, длина: 1990}
      порог_предложено: 2000
    basis: [Н, П, "?"]
    status: предложено
    src: [NR-02, HT-05]
    afabrik: [W09]
    needs: [высота и толщина двери]
    note: "Порог 1800–2000 — практика без надёжного источника. Альтернатива для фасада 16 — двери до потолка не делать: разделить на дверь основного корпуса и антресоли."

  # ===================== SLD: двери купе =====================
  - id: RW-SLD-01
    title: "Адаптер системы купе"
    rule: "Двери купе считать только по документу выбранной системы и профиля. Адаптер хранит: вычет высоты Δ_H, перекрытие p (со шлегелем и без), вычеты заполнения по материалу, ширину верхней и нижней направляющих, предельные высоту, ширину и массу створки, нагрузку на ролик, условия доводчика и усилителя. Формулы одной системы на другую не переносить; профиль, ролики и направляющие — одной системы (R-SUP-01). Систему по умолчанию выбирает владелец (Q-08). Нет адаптера — нет расчёта створок для производства."
    basis: [П, И, "?"]
    status: предложено
    src: [AR-01, RP-01, RP-02, KR-01]
    afabrik: [W09, C02]
    needs: [система и профиль купе]
    note: "Документы «Командора» не открылись (D-01); его формулы пока не использовать."

  - id: RW-SLD-02
    title: "Высота створки купе"
    rule: "H_дв = H_пр − Δ_H, где H_пр — высота проёма между верхней и нижней направляющими по месту установки. Δ_H по системе: Aristo «Стандарт» — 40, с доводчиком 45; Aristo NOVA — 45 (направляющая видна), 32 (направляющая скрыта в проём); Raumplus S1200 — 45. Если пол или потолок неровные, H_пр мерить в самой низкой точке и выставлять направляющую по уровню."
    params:
      Δ_H: {aristo_стандарт: 40, aristo_стандарт_доводчик: 45, aristo_nova_видимая: 45, aristo_nova_скрытая: 32, raumplus_s1200: 45}
    calc:
      - {name: "Aristo «Стандарт», проём 2600", expr: "H - d", vars: {H: 2600, d: 40}, expect: 2560}
      - {name: "Raumplus S1200, проём 2600", expr: "H - d", vars: {H: 2600, d: 45}, expect: 2555}
    basis: [П]
    status: предложено
    src: [AR-01, RP-01]
    afabrik: [W09]
    needs: [система, высота проёма]
    note: "Форум и статьи называют 30 и 46 — без привязки к системе (X-08)."

  - id: RW-SLD-03
    title: "Ширина створки купе"
    rule: "W_дв = (L_пр + k·p) / n, где L_пр — ширина проёма, n — число створок, k — число перекрытий (n − 1 при створках, идущих поочерёдно; для 4 створок по схеме «2 + 2» — 2), p — перекрытие профиля. p по системе: Aristo «Стандарт» C/O/I — 25 (со шлегелем 15), H — 35 (25), FUSION — 39,5 (29,5); Aristo NOVA и Raumplus S1200 — 12. Таблица примеров — в 05-sliding-doors.md."
    params:
      p: {aristo_C_O_I: 25, aristo_C_O_I_шлегель: 15, aristo_H: 35, aristo_FUSION: 39.5, aristo_nova: 12, raumplus_s1200: 12}
    calc:
      - {name: "Aristo C/O/I, проём 2000, 2 створки", expr: "(L + k * p) / n", vars: {L: 2000, k: 1, p: 25, n: 2}, expect: 1012.5}
      - {name: "Aristo C/O/I, проём 2400, 3 створки", expr: "(L + k * p) / n", vars: {L: 2400, k: 2, p: 25, n: 3}, expect: 816.67}
      - {name: "Raumplus S1200, проём 2400, 3 створки", expr: "(L + k * p) / n", vars: {L: 2400, k: 2, p: 12, n: 3}, expect: 808}
    basis: [П]
    status: предложено
    src: [AR-01, RP-01]
    afabrik: [W09]
    needs: [система, профиль, шлегель, ширина проёма, число створок]
    note: "Перекрытие — величина системы, а не ширина видимого профиля: у Aristo 25–45, у NOVA и Raumplus 12, на форуме для Raumplus — 32 (X-09)."

  - id: RW-SLD-04
    title: "Предельные размеры и масса створки"
    rule: "Проверять створку по пределам системы: Aristo «Стандарт» — высота до 3200, ширина 500–1500, до 100 кг, нагрузка на нижний ролик 50 кг; Aristo «Эконом» — до 2500, 500–900, до 40 кг; Aristo NOVA — до 2600, 500–1500, до 80 кг; Raumplus S1200 — по листовке до 2750 × 1500 (X-10), ролик 80 кг. Отношение высоты к ширине не больше 4 : 1, рекомендовано 3 : 1 (Aristo). Практика: створка не шире 1200."
    params:
      aristo_стандарт: {H_max: 3200, W: [500, 1500], кг: 100}
      aristo_эконом: {H_max: 2500, W: [500, 900], кг: 40}
      aristo_nova: {H_max: 2600, W: [500, 1500], кг: 80}
      raumplus_s1200_листовка: {H_max: 2750, W_max: 1500}
      H_к_W_max: 4
      H_к_W_рекомендовано: 3
    calc:
      - {name: "H:W створки 2560 × 612,5", expr: "H / W", vars: {H: 2560, W: 612.5}, expect: 4.18}
      - {name: "минимальная ширина при H 2560 и 3 : 1", expr: "H / 3", vars: {H: 2560}, expect: 853.33}
    basis: [П, Р]
    status: предложено
    src: [AR-01, RP-01, RP-02, ST-08]
    afabrik: [W09]
    needs: [система, размеры и масса створки]
    note: "Створка 2560 × 612,5 (проём 1200 на две) нарушает предел 4 : 1 — нужна одна створка или распашная дверь. Нагрузка на ролик «Командора» — 25 кг (KM-01)."

  - id: RW-SLD-05
    title: "Заполнение створки"
    rule: "Размер вставки считать от размера створки по таблице профиля. Aristo «Стандарт» C/O/I: ЛДСП 10 — H_дв − 57, W_дв − 36; ЛДСП 8 — H_дв − 59, W_дв − 38; зеркало или стекло 4 — H_дв − 60, W_дв − 39. Raumplus S1200: ДСП — H_дв − 6, стекло — H_дв − 7, ширина W_дв − 11. Горизонтальный разделитель делит высоту вставки с вычетом по профилю (Aristo: 9 для ЛДСП 10 / ЛДСП 10 с саморезом)."
    params:
      aristo_C_O_I: {ЛДСП_10: [57, 36], ЛДСП_8: [59, 38], зеркало_4: [60, 39]}
      raumplus_s1200: {ДСП_H: 6, стекло_H: 7, W: 11}
    calc:
      - {name: "вставка ЛДСП 10 Aristo при створке 2560 × 1012,5: высота", expr: "H - 57", vars: {H: 2560}, expect: 2503}
      - {name: "та же вставка: ширина", expr: "W - 36", vars: {W: 1012.5}, expect: 976.5}
    basis: [П]
    status: предложено
    src: [AR-01, RP-01]
    afabrik: [W09]
    needs: [система, профиль, материал вставки]
    note: "Вычеты сверены с таблицей профиля C, O, I каталога Aristo 2020; для профилей H и FUSION вычеты ширины другие (ЛДСП 10: 54 и 60). Вставки длиннее 2500 из ЛДСП 10 упираются в формат плиты (RW-DIM-06)."

  - id: RW-SLD-06
    title: "Направляющие и основание купе"
    rule: "Верхнюю направляющую крепить к крыше корпуса, к потолку или к верхней фальш-панели строго по уровню; нижнюю — на ровное дно или пол. Ширина и высота направляющих — по системе (RW-DIM-03). Aristo NOVA со скрытой направляющей: глубина крыши B_кр = B_шк − 93, глубина дна = B_кр + 93. Длина направляющей равна ширине проёма."
    params:
      aristo_nova_вычет_крыши: 93
    calc:
      - {name: "крыша NOVA при глубине шкафа 650", expr: "D - 93", vars: {D: 650}, expect: 557}
    basis: [П]
    status: предложено
    src: [AR-01, RP-02]
    afabrik: [W09]
    needs: [система, способ монтажа направляющей]
    note: "Подвесные системы (Raumplus AIR, Aristo «4 в 1») крепятся к потолку и требуют несущего основания; у Aristo подвесы при креплении к стене — через 500."

  - id: RW-SLD-07
    title: "Число створок и доводчик"
    rule: "Число створок n выбирать так, чтобы створка укладывалась в пределы системы (RW-SLD-04), лучше с H : W ≤ 3, и чтобы стыки створок приходились на перегородки (RW-CAR-04). Ориентир практики: 2 створки — проём 900–1800, 3 — 1800–2500, дальше 4. Доводчик Raumplus — расстояние между вертикальными профилями не меньше 750. Aristo NOVA: ширина больше 900 или высота больше 2400 — 1–2 усилителя в 500 от верха и низа; ширина больше 1000 — 3 ролика."
    params:
      две_створки: [900, 1800]
      три_створки: [1800, 2500]
      доводчик_raumplus_min: 750
    basis: [П, Р]
    status: предложено
    src: [AR-01, RP-02, ST-09]
    afabrik: [W09]
    needs: [ширина проёма, система]
    note: "Таблица проверки в 05-sliding-doors.md показывает, что при высоте 2560 две створки на проём 1600 нарушают рекомендуемое 3 : 1, хотя проходят предел 4 : 1."

  # ===================== ANT: антресоль =====================
  - id: RW-ANT-01
    title: "Зона выше 1900"
    rule: "Выше 1900 от пола — только вещи редкого пользования (ГОСТ 13025.1-85, п. 2.3; табл. 6 для кухни). Там размещать антресоль или верхние полки; штанга выше 1900 — только с пантографом (RW-INT-04)."
    params:
      граница_частого_пользования: 1900
    basis: [Н]
    status: предложено
    src: [NR-01]
    afabrik: [C12]
    needs: []
    note: "Рекомендованную высоту антресоли источники не дали; её задаёт потолок (RW-ANT-02)."

  - id: RW-ANT-02
    title: "Антресоль отдельным корпусом"
    rule: "Антресоль — отдельный корпус над основным, если основной корпус до потолка не проходит подъём лёжа (RW-DIM-05), не помещается в одну боковину (RW-DIM-06) или дверь до потолка не держит форму (RW-SWG-05). Высота антресоли H_ант = H_пот − H_осн − z_пот (z_пот — зазор до потолка, закрываемый планкой). Предложение: делить при общей высоте выше 2400 (Q-09). Двери антресоли — по RW-SWG-03 (до 900 — две петли), шов между дверями основного корпуса и антресоли — 3."
    calc:
      - {name: "H_ант при потолке 2700, корпус 2200, зазор 30", expr: "P - H - z", vars: {P: 2700, H: 2200, z: 30}, expect: 470}
    basis: [И, "?"]
    status: предложено
    src: [AF-01, ST-01]
    afabrik: [C12]
    needs: [высота потолка, высота основного корпуса]
    note: "Как ставить антресоль — вровень или с выступом — решает C12. Корпуса скреплять стяжками между собой, а антресоль крепить к стене (RW-INS-01)."

  # ===================== INS: установка =====================
  - id: RW-INS-01
    title: "Крепление шкафа к стене"
    rule: "Предложение: крепить к стене каждый шкаф выше 1600 — не меньше двух точек в верхней части корпуса (уголок или навес на анкер по материалу стены); антресоль — отдельно (Q-05). Основание: ГОСТ 19882-91 испытывает на опрокидывание только незакреплённую мебель — закреплённая испытанию не подлежит; IKEA требует крепить высокие шкафы PAX; продавцы советуют крепить от 2400."
    params:
      H_крепить_предложено: 1600
      точек_min: 2
    basis: [Н, П, Р, "?"]
    status: предложено
    src: [NR-03, NR-02, IK-01, ST-13]
    afabrik: []
    needs: [высота шкафа, материал стены]
    note: "Таблица устойчивости ГОСТ 16371-2014 (п. 5.2.31, табл. 4) извлечена не полностью (D-08); обязательного крепления к стене ГОСТ не содержит."

  - id: RW-INS-02
    title: "Зазор до потолка у отдельностоящего шкафа"
    rule: "Отдельностоящий шкаф не доводить до потолка вплотную: высоту брать по RW-DIM-05 (подъём лёжа, запас 30), щель закрывать планкой или фальш-панелью по месту. Если шкаф собирают стоя, запас по высоте всё равно не меньше 30 на монтаж и неровность потолка (RW-INS-05)."
    params:
      запас_min: 30
    basis: [И, Р]
    status: предложено
    src: [ST-10, ST-07]
    afabrik: [W-R02]
    needs: [высота потолка в низшей точке]
    note: "Типового нормированного зазора до потолка нет."

  - id: RW-INS-03
    title: "Встроенный шкаф-купе: фальш-панели и потолок"
    rule: "По периметру встроенного купе ставить фальш-панели шириной 80–120, чтобы скрыть неровности стен и потолка (практика). Перепад потолка на длине шкафа бывает 10–20: верхнюю направляющую ставить по уровню на подкладки или на верхнюю фальш-панель. Запас на неровность стены — 20 на каждую стену, как у кухни (R-JNC-08)."
    params:
      фальш_панель: [80, 120]
      перепад_потолка: [10, 20]
      запас_на_стену: 20
    basis: [Р, И]
    status: предложено
    src: [ST-06, ST-07, KR-01]
    afabrik: [W-R07]
    needs: [замер стен и потолка]
    note: "Aristo предлагает корректирующие профили для неровных стен, пола и потолка без чисел."

  - id: RW-INS-04
    title: "Добор между распашной дверью и стеной"
    rule: "Распашная дверь у стены или перпендикулярной панели: добор не меньше max(50, h_ручки + 20) с ручкой, без ручки — 30; запас на неровность стены 20, добор подрезается по месту (решение по кухне R-JNC-08). Это обеспечивает открывание двери не меньше 90° и выдвижение ящиков за ней (RW-DRW-03)."
    calc:
      - {name: "добор при ручке 35", expr: "max(50, h + 20)", vars: {h: 35}, expect: 55}
    basis: [И]
    status: предложено
    src: [KR-01]
    afabrik: [W-R07]
    needs: [вылет ручки]
    note: "У купе добор не нужен: створки не открываются наружу, но нужен зазор фальш-панели (RW-INS-03)."

  - id: RW-INS-05
    title: "Шкаф в нише: монтажный запас"
    rule: "Корпус в нише меньше ниши по высоте не меньше чем на 30 и по ширине не меньше чем на 50 (данные фабрики), с учётом допуска габарита ±5 (RW-DIM-07). Нишу мерить в трёх точках по высоте и ширине, брать наименьшее. Плинтус (W-R03) — вырез в боковинах или отступ корпуса на его толщину."
    params:
      запас_по_высоте: 30
      запас_по_ширине: 50
    calc:
      - {name: "ширина корпуса при нише 2000 (наименьший замер)", expr: "N - 50", vars: {N: 2000}, expect: 1950}
    basis: [Р, Н]
    status: предложено
    src: [ST-10, NR-02]
    afabrik: [W-R02, W-R03]
    needs: [замер ниши]
    note: "Запасы 30/50 — из поисковой выдачи (ST-10); подтвердить практикой монтажников AFABRIK."

  # ===================== LAY: порядок проектирования =====================
  - id: RW-LAY-01
    title: "Порядок проектирования шкафа"
    rule: "1) Замер (W-R01…W-R09), низшая точка потолка, неровность стен. 2) Тип: распашной или купе, встроенный или отдельностоящий. 3) Задняя стенка и глубина (RW-DIM-01…04). 4) Высота: подъём лёжа, боковина, антресоль (RW-DIM-05, RW-DIM-06, RW-ANT-02). 5) Двери: петли (RW-SWG) или система купе и число створок (RW-SLD). 6) Секции по наполнению и стыкам створок (RW-CAR-04). 7) Зоны и штанги (RW-INT), полки (RW-SHF), ящики (RW-DRW). 8) Установка и крепление (RW-INS). 9) Проверка по 06-checklist.md."
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [W-B01]
    needs: []
    note: "Порядок повторяет инструкцию AFABRIK 03-wardrobe-workflow и добавляет числа."

  - id: RW-LAY-02
    title: "Пример: распашной шкаф 1800 × 2400"
    rule: "Шкаф 1800 × 2400, потолок 2600, ХДФ в паз, фасад 18, цоколь 60. Глубина: D_корп 580, D_вн 560, D_полн 598. Подъём лёжа: диагональ sqrt(2400² + 580²) = 2469 ≤ 2570 — проходит. Секции: 3 модуля по 600, внутри (1800 − 4·16)/3 ≈ 579 — полки 16 под бельё (до 800) проходят. Двери 597 × 2337 (2400 − цоколь 60 − 3), масса около 17,6 кг: по высоте — 5 петель, по массе — 5 (Blum 17–22). Штанга длинной одежды на 1900 (верх), под ней 1900 − 76 = 1824 ≥ 1400."
    calc:
      - {name: "диагональ корпуса 2400 × 580", expr: "sqrt(H**2 + D**2)", vars: {H: 2400, D: 580}, expect: 2469.09}
      - {name: "масса двери 597 × 2337 × 18, кг", expr: "W * H * t * 700 / 1e9", vars: {W: 597, H: 2337, t: 18}, expect: 17.58}
      - {name: "внутренняя ширина секции", expr: "(W - 4 * 16) / 3", vars: {W: 1800}, expect: 578.67}
      - {name: "отделение под штангой 1900 при цоколе 60", expr: "1900 - (c + 16)", vars: {c: 60}, expect: 1824}
    basis: [И]
    status: предложено
    src: [NR-01, MD-01, BL-01]
    afabrik: [W-B01]
    needs: []
    note: "Пример для проверки арифметики, а не готовый проект."

  - id: RW-LAY-03
    title: "Пример: купе 2400 × 2600 на Aristo «Стандарт»"
    rule: "Ниша 2450 × 2650 (наименьшие замеры), глубина шкафа 650, ХДФ в паз, профиль C, без шлегеля, без доводчика. Корпус по нише: ширина 2450 − 50 = 2400. Проём по высоте 2600: створка 2600 − 40 = 2560. Три створки: (2400 + 2·25)/3 = 816,7; H : W = 3,13 — укладывается в 4 : 1, но больше рекомендуемого 3 : 1 (Q-08 — согласовать с системой или поставить 2 + 2). Внутренняя глубина 650 − 20 − 100 = 530 — меньше ГОСТ 560 (Q-03)."
    calc:
      - {name: "ширина створки", expr: "(L + k * p) / n", vars: {L: 2400, k: 2, p: 25, n: 3}, expect: 816.67}
      - {name: "H:W", expr: "H / W", vars: {H: 2560, W: 816.67}, expect: 3.13}
      - {name: "внутренняя глубина", expr: "D - k - z", vars: {D: 650, k: 20, z: 100}, expect: 530}
    basis: [И, П]
    status: предложено
    src: [AR-01]
    afabrik: [W09]
    needs: []
    note: "Пример показывает два спорных места: рекомендуемое отношение створки и глубина за дверями."
