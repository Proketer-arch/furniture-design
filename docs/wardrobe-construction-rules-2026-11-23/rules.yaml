  - id: RW-INT-06
    title: "Пролёт штанги без опоры"
    rule: "Стационарная штанга по ГОСТ: прогиб эталонной штанги длиной 1 м — не более 8 (ГОСТ 16371-2014, табл. 3) при нагрузке 30 даН/м (ГОСТ 19882-91, п. 1.6). Предложение: пролёт штанги Ø25 или овальной 30×15 без промежуточной опоры — не более 1000; длиннее — средний штангодержатель или перегородка (Q-06). Для конкретной штанги — по данным производителя (Aristo Ø25: 600 — 15 кг, 1000 — 25 кг)."
