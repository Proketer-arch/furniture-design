  - id: R-GLA-06
    title: "Длина профиля и сопряжения"
    rule: "«Профиль режется по ширине модулей (Emuca поставляет в стандартных длинах под резку). Профиль непрерывен по ряду; стыки по углам — торцевые заглушки или косой рез. Длину реза брать как ширина по фасадам + технологический припуск (ориентир 2–4, Р) — уточнять по инструкции профиля.»"
    params:
      припуск: [2, 4]
    basis: [П, Р]
    status: предложено
    src: [GL-02, GL-08]
    afabrik: [K02, K05]
    needs: [инструкция профиля]
    note: "«Припуск 2–4 в сессии прочитан из руководства mebelkomplekt (GL-08); перепроверить.»"

  - id: R-GLA-07
    title: "Ограничения Gola"
    rule: "«Gola не применять на радиусных и трапециевидных модулях без отдельного решения (Р). Фасады из МДФ и ЛДСП; нужна точная кромка (GL-10). Вертикальные профили на пеналах — длины до 2200 и по высоте фасада.»"
    basis: [Р]
    status: предложено
    src: [GL-08, GL-10]
    afabrik: [K02, K04]
    needs: []
    note: "«Для вертикального профиля источники называют длины 250…2200 в общем виде (профильные ручки), не только Gola.»"

  # ===================== LAY: планировки и рецепты =====================
  - id: R-LAY-01
    title: "Порядок проектирования модульной кухни"
    rule: "«Двенадцать шагов: 1) исходные данные и обмер; 2) тип планировки и наличие антресоли; 3) выбор систем фурнитуры и профиля (адаптеры); 4) высоты (R-DIM-04, -05); 5) глубины и свесы (R-DIM-02, -03, -06); 6) угловые решения (R-JNC); 7) раскладка ширин по рядам (R-LAY-02); 8) верхний ряд по осям нижнего и вытяжка (R-DIM-09); 9) антресоль и подъёмники (R-MOD-12, R-LFT); 10) расчёт узлов: LW, LT, NL, ящики, петли, фасады; 11) проверки (12-checklists.md); 12) реестр допущений C/Q/D. Шаг не пропускать; пропуск фиксируется как допущение.»"
    params:
      шаги: [исходные данные, тип планировки, системы фурнитуры, высоты, глубины, углы, раскладка ширин, верхний ряд, антресоль и подъёмники, расчёт узлов, проверки, реестр допущений]
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [C01, C02, C03, C04, C05, C06, C07, C08, C09, C10, C11, C12]
    needs: []
    note: "«Порядок согласован с процессом AFABRIK (бриф → модель → проверка → выпуск).»"

  - id: R-LAY-02
    title: "Раскладка ряда по ширинам"
    rule: "«Длина ряда L = Σ W_i + Σ W_добора. Сначала ставятся модули с фиксированной шириной (ниша техники, мойка, варочная панель), затем остаток набирается модулями из ряда (R-DIM-08) от больших к малым; остаток меньше минимального модуля — добор (R-MOD-13). Избегать более одного добора на ряд и добора у угла.»"
    calc:
      - {name: "ряд 3300: мойка 800, панель 600, холодильник 600, ПММ 600, остаток", expr: "L - (800 + 600 + 600 + 600)", vars: {L: 3300}, expect: 700}
    basis: [И]
    status: предложено
    src: [IS-05]
    afabrik: [K06]
    needs: [длина ряда, список техники]
    note: "«Пример иллюстративный; остаток 700 можно закрыть модулями 300 + 400 или 400 + 300.»"

  - id: R-LAY-03
    title: "Линейная кухня"
    rule: "«Один ряд нижних модулей и один верхних вдоль одной стены; мойка и варочная панель разнесены не менее чем на 400 (R-MOD-04); холодильник и пенал — на концах ряда; ряд без угла и без слепых зон; проход перед рядом по помещению. Антресоль — по R-MOD-12.»"
    basis: [И, Р]
    status: предложено
    src: [IS-03]
    afabrik: []
    needs: [длина стены]
    note: "«Линейный вариант — базовый: остальные планировки получаются добавлением угла (R-JNC) или острова (R-ISL).»"

  - id: R-LAY-04
    title: "Г-образная кухня"
    rule: "«Два ряда под 90° с углом по R-JNC-01. Выбрать, какой ряд доходит до угла, и пересчитать слепую зону по R-JNC-02. Длины рядов: L1 = стена 1, L2 = стена 2 − D_полн(ряд 1). Подбор модулей — R-LAY-02 для каждого ряда отдельно.»"
    calc:
      - {name: "L2 при стене 2 в 3000 и D_полн 579", expr: "wall - D", vars: {wall: 3000, D: 579}, expect: 2421}
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K05, C03]
    needs: [стены, угловое решение]
    note: "«Если угловой модуль L-образный (задние стенки у двух стен), L2 считается от его габарита.»"

  - id: R-LAY-05
    title: "П-образная кухня"
    rule: "«Три ряда и два угла; расстояние между параллельными рядами в свету не менее суммы двух D_полн и прохода: W_пом ≥ D_полн1 + a + D_полн2, где a ≥ 1000 (R-ISL-01). Секции у плиты — 900–1200 (Р). Пеналы по 600 в количестве 2–3 (Р).»"
    calc:
      - {name: "ширина между рядами, проход 1000", expr: "D1 + a + D2", vars: {D1: 579, a: 1000, D2: 579}, expect: 2158}
    basis: [И, Р]
    status: предложено
    src: [IS-05]
    afabrik: [C03]
    needs: [размеры помещения]
    note: "«Проход между ногами П-образной — по политике R-ISL-01.»"

  - id: R-LAY-06
    title: "Кухня с островом или полуостровом"
    rule: "«Остров добавляется к линейной, Г- или П-образной планировке: проходы, размеры, посадка, примыкание — R-ISL-01…06; ширина помещения под одним рядом + остров — формула R-ISL-02. Ряд напротив острова проверять на столкновение дверей и ящиков.»"
    basis: [И]
    status: предложено
    src: [IS-01]
    afabrik: []
    needs: [размеры помещения]
    note: "«Если помещение не вмещает остров по R-ISL-01, остров исключается из планировки (JLC/NKBA: остров, не оставляющий проход двоим, убирается).»"

  - id: R-LAY-07
    title: "С антресолью и без"
    rule: "«Без антресоли: между верхом верхнего ряда и потолком 300–400 (Р). С антресолью: ярус R-MOD-12; дно и фасад по K19/C12; подъёмники по R-LFT; задняя стенка по K17; проверка высоты досягаемости (верх полки частого пользования не выше 1900, Н). При потолке выше 3000 решение «до потолка» — отдельное (Р).»"
    params:
      без_антресоли: [300, 400]
      полка_частого_пользования_max: 1900
      потолок_отдельное_решение: 3000
    basis: [Р, Н, И]
    status: предложено
    src: [IS-03, NR-01, AF-01]
    afabrik: [K14, K17, K18, K19, C12]
    needs: [высота потолка]
    note: "«Антресольные ящики — по R-DRW-13.»"

  - id: R-LAY-08
    title: "Рецепт сборки из карточек"
    rule: "«Планировка собирается из карточек R-MOD: для каждого ряда — список модулей слева направо с KB, типом и адаптерами; затем таблица узлов (LW, LT, NL, ящики, петли, фасады). Ручной пересчёт не ведётся: изменение адаптера пересчитывает только зависимые детали (R-SUP-02).»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: []
    needs: []
    note: "«Подробные рецепты — 10-layouts-and-assembly-recipes.md.»"

  # ===================== SUP: фурнитура и рынок =====================
  - id: R-SUP-01
    title: "Не смешивать бренды в одном узле"
    rule: "«В одном узле (ящик + направляющая; петля + планка; подъёмник + фасад) использовать компоненты одного производителя и одной серии. Причины: различие креплений и ходов (medyn.su); Blum не отвечает за узлы EXPANDO T в сочетании с фурнитурой других производителей.»"
    basis: [П, Р]
    status: предложено
    src: [MK-02, BL-20]
    afabrik: []
    needs: []
    note: "«Допустимо сочетание разных брендов в разных узлах одного заказа (например, петли одного, ящики другого), если нет общей сопряжённой детали.»"

  - id: R-SUP-02
    title: "Нет адаптера — нет присадки"
    rule: "«Присадка, раскрой дна и задней стенки ящика и расчёт фасадов выпускаются только при заданном адаптере системы (R-DRW-01) и закрытых вопросах C02, C09. Смена системы пересчитывает зависимые детали, но не габариты модулей.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [C02, C09, C07]
    needs: []
    note: "«Согласуется с правилом пакета AFABRIK о неполном брифе.»"

  - id: R-SUP-03
    title: "Приоритет документов"
    rule: "«Первичный документ производителя на точную серию и редакцию старше копий дилеров, форумов и каталогов магазинов. Если используется копия, в правиле ставится тег П (копия) и запись в D-реестр о сверке по оригиналу.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: []
    needs: []
    note: "«В базе копиями являются: BL-04, BL-05, BL-07, BL-10, BL-11, BL-12, BL-15…BL-17, BL-22, MD-01.»"

  - id: R-SUP-04
    title: "Рынок РФ: состояние на дату сбора"
    rule: "«18-й пакет санкций ЕС (июль 2025) запретил ввоз ряда европейских изделий (петли, доводчики, замки, ручки, крепёж); поставщики прекратили отгрузки, часть производителей перешла на китайские аналоги или локализацию, цены с 1 августа выросли на 35–40 % (Р). Samet заявляет, что продолжает работу. К октябрю 2026: у части розничных поставщиков позиции Blum (CLIP top, TANDEMBOX antaro, LEGRABOX, TIP-ON, подъёмные механизмы HF) значатся «в наличии», дата страницы не указана (MK-06); в обзоре 20-го пакета санкций (апрель 2026) фурнитура не упомянута, но перечень открытый, полный текст регламента не проверен (MK-08). Документального подтверждения устойчивых поставок Blum и Hettich в 2026 нет — наличие и артикулы проверяются у поставщика перед выбором адаптера.»"
    basis: [Р]
    status: предложено
    src: [MK-01, MK-02, MK-03, MK-04, MK-06, MK-08]
    afabrik: []
    needs: [запрос поставщику]
    note: "«Дата источника BFM: 07.08.2025 (обновлён 11.08.2025); Альта-Софт — 11.08.2025: китайские аналоги во многом заместили европейские, часть производства организована в России. Сведения устаревают быстро (D-13).»"

  - id: R-SUP-05
    title: "Функциональные аналоги"
    rule: "«Аналог подбирается по функции и классу нагрузки, не по размерам: ящик с двойной боковиной (Hettich ArciTech/Atira, Boyard START/MB, GTV Axis Pro) и с тонкой боковиной (Blum LEGRABOX, Hettich AvanTech YOU, Unihopper Magic Box); петли (Blum CLIP top, Hettich Sensys, Boyard EVO); подъёмники (Blum AVENTOS, Hettich Lift Advanced, газлифты Boyard GL). Размерные формулы одного бренда на другой не переносить (R-SUP-01). Замена бренда = замена адаптера.»"
    basis: [И]
    status: предложено
    src: [BL-01, HT-01, BY-01, UH-01, GT-01]
    afabrik: []
    needs: []
    note: "«Складных фасадов типа HF вне Blum и Hettich в источниках нет (R-LFT-08).»"

  - id: R-SUP-06
    title: "Состав документов на систему"
    rule: "«На каждую выбранную систему получить: для ящиков — планировочный лист (LT/NL, дно, задняя стенка, EB, присадка, синхронизация); для петель — таблицы наложения, TB, зазоров, число по массе и высоте; для подъёмников — таблицы LF/массы, присадка, мин. глубина; для профиля — чертёж сечения и инструкция. Хранить редакцию и дату.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: []
    needs: []
    note: "«Конкретные документы, которых не хватает, перечислены в D-реестре.»"

  - id: R-SUP-07
    title: "Ресурс и класс системы"
    rule: "«Класс фурнитуры выбирать по ожидаемой нагрузке и ресурсу: Blum до 200 000 циклов, Hettich до 160 000, аналоги 60 000–120 000 (Р, источник маркетинговый); Boyard EVO 100 000; Unihopper скрытые направляющие 60 000 (TÜV). Цифры ресурса не использовать как расчётное основание без паспорта.»"
