    note: "«Для 125° с нулевым вхождением предел толщины 30 (BL-23).»"

  - id: R-HNG-10
    title: "Угловые и диагональные петли"
    rule: "«Для фасадов в углах (±45° и др.) использовать угловые петли: угловые варианты — −5°, 5°, 10°, 15° для планок, 10°–50° для общих сочетаний; TB для угловых определяется шириной двери по таблице производителя. Числовые таблицы Blum стр. 123–125 каталога брать при проектировании конкретного угла.»"
    basis: [П]
