  - id: R-ASM-08
    title: "Сохранение ручных исправлений и согласование параметров"
    rule: "«До регенерации сравнить фактические положения и размеры с паспортом параметров, включая вложенные детали. Ручные исправления сохранить и зафиксировать; согласовать параметры с геометрией либо явно ограничить дальнейшую автоматизацию объекта. Не стирать исправления пользователя молчаливым пересозданием.»"
