      aventos_LT_min: {HF_top: 264, HS_top: 264, HL_top: 264, HK_top: 187, HK_top_видимые_навески: 261, HK_S: 163, HK_S_видимые_навески: 240, HK_XS: 125, HK_XS_специальная: 100}
      aventos_обзор_консервативно: {HF: 278, HS: 276, HL: 278}
      hettich_lift_advanced: 182
    calc:
      - {name: "LT верхнего модуля 320 в пазу", expr: "D - k", vars: {D: 320, k: 20}, expect: 300}
    basis: [П]
    status: предложено
    src: [BL-10, BL-11, BL-12, HT-05]
    afabrik: [K11, K12, K19]
    needs: [серия подъёмника]
    note: "«Верхний модуль 320 с задней стенкой в пазу (LT 300) проходит по глубине все типы AVENTOS top и Lift Advanced. Толкование «видимые навески» как глубины, а не высоты, принято по BL-10 — сверить (X-03).»"

  - id: R-LFT-04
    title: "Число петель/шарниров складного и поворотного фасада"
    rule: "«HF top: 3 шарнира при KB ≥ 1200 или массе фасада ≥ 12 кг; 4 шарнира при KB 1800 или ≥ 20 кг. HK-XS: 3 петли при KB ≥ 900 или LF ≥ 1800; 4 при KB 1200 или LF ≥ 2700. Минимальный зазор снизу: HK-XS 1,5; HF top 1,5; HK top 2 (MF).»"
    params:
      HF_top: {три_шарнира: {KB_от: 1200, масса_от_кг: 12}, четыре: {KB: 1800, масса_от_кг: 20}}
      HK_XS: {три_петли: {KB_от: 900, LF_от: 1800}, четыре: {KB: 1200, LF_от: 2700}}
      зазор_min: {HK_XS: 1.5, HF_top: 1.5, HK_top: 2}
    basis: [П]
    status: предложено
