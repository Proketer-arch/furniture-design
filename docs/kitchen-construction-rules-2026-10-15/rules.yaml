  - id: R-LFT-04
    title: "Число петель/шарниров складного и поворотного фасада"
    rule: "«HF top: 3 шарнира при KB ≥ 1200 или массе фасада ≥ 12 кг; 4 шарнира при KB 1800 или ≥ 20 кг. HK-XS: 3 петли при KB ≥ 900 или LF ≥ 1800; 4 при KB 1200 или LF ≥ 2700. Минимальный зазор снизу: HK-XS 1,5; HF top 1,5; HK top 2 (MF).»"
