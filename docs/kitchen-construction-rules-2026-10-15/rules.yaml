  - id: R-LFT-09
    title: "Складные фасады и антресоль"
    rule: "«Складной фасад (HF) применять на верхних модулях с крупным фасадом, когда открывание вбок мешает (над рабочей зоной, в нишах). Антресоль: выступающая — дно накладное; вровень с верхом — вкладное (K19, C12); подъёмник для антресоли подбирать по R-LFT-01…03 с KH = высота антресоли в свету. Другие складные механизмы (горизонтально-складные, гармошка) источниками не охвачены.»"
