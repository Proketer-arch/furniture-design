# Правила проектирования, сборки и модульного построения кухни (предложено).
# Дата: 2026-10-15. Единицы: мм, если не указано иное.
# Источник правды для идентификаторов R-<ДОМЕН>-NN. Описание метода: 00-method.md.
# Идентификаторы источников — в 14-sources.md. Проверка: python3 -I tools/check_rules.py
meta:
  title: Правила проектирования и сборки модульной кухни
  version: 2026-10-15
  status: предложено
  units: мм
  basis_tags:
    Н: норматив
    П: первичный документ производителя
    И: инженерная практика / пакет AFABRIK
    Р: ориентир (вторичный источник)
    "?": решение владельца
  domains:
    DIM: размерные цепи и сетка
    CAR: корпус и сборка
    FRN: фасады
    HNG: петли
    DRW: ящики
    LFT: подъёмники и складные фасады
    MOD: библиотека модулей
    JNC: углы и стыки
    ISL: остров
    GLA: профиль Gola
    LAY: планировки и рецепты
    SUP: фурнитура и рынок
rules:

  # ===================== DIM: размерные цепи и сетка =====================
  - id: R-DIM-01
    title: "Три независимые размерные цепи"
    rule: "«Высоту, глубину и ширину считать отдельными цепями. Для каждого размера хранить значение, базу отсчёта (корпус, фасад или вся конструкция), источник и статус. Размер корпуса и полный габарит не смешивать.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K01, K02, K11, C03, C08]
    needs: []
    note: "«Следствие из правила AFABRIK «не выбирать значение молча»: пока база C03 не закрыта, общий габарит предварительный.»"

  - id: R-DIM-02
    title: "Глубина нижнего модуля и полный габарит"
    rule: "«D_полн = D_корп + t_фасада. D_корп: 560 для стандартной ручки, 575 для Gola (K01, K02). Задний технический зазор 50 хранить отдельным параметром g_зад и не прибавлять повторно. Габарит от стены считать после решения C03: вариант A — 50 входят в D_корп-базу; вариант B — добавляются к ней.»"
    params:
      D_корп: {стандартная_ручка: 560, gola: 575}
      g_зад: 50
    calc:
      - {name: "D_полн стандартная ручка, фасад 19", expr: "560 + t", vars: {t: 19}, expect: 579}
      - {name: "D_полн Gola, фасад 19", expr: "575 + t", vars: {t: 19}, expect: 594}
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K01, K02, C03]
    needs: [толщина фасада, ручка или Gola]
    note: "«Проверка согласованности (не решение): при варианте A передняя плоскость фасада на 579 мм от стены (560+19), стандартная столешница 600 даёт свес 21 мм — внутри ориентира 20–50 мм. При варианте B (+50) плоскость на 629 мм, столешница 600 фасад не перекрывает. Это довод в пользу A; закрывает C03 только владелец заказа.»"

  - id: R-DIM-03
    title: "Столешница: глубина и свес над фасадом"
    rule: "«Глубина шкафа-стола 600 мм (Н). Свес столешницы над фасадом: ориентир 20–50 мм при обычной ручке; при Gola 5 мм (прямая кромка) и 10 мм (постформинг). Свес считать как глубина_столешницы − (D_корп + t_фасада) и проверять по этой формуле.»"
    params:
      глубина_шкафа_стола: 600
      свес_обычная_ручка: [20, 50]
      свес_gola: {прямая_кромка: 5, постформинг: 10}
    calc:
      - {name: "свес, стандартная ручка, фасад 19, столешница 600", expr: "600 - (560 + t)", vars: {t: 19}, expect: 21}
      - {name: "свес, Gola, фасад 19, столешница 600", expr: "600 - (575 + t)", vars: {t: 19}, expect: 6}
    basis: [Н, Р]
    status: предложено
    src: [NR-01, IS-05, GL-07]
    afabrik: [K01, K02, C03]
    needs: [толщина фасада, глубина столешницы]
    note: "«Для Gola результат 6 мм при фасаде 19 близок к ориентиру 5 мм — второй довод в пользу варианта A из R-DIM-02. Столешницы глубже 600 (до 900, на острове до 1200 — Р) пересчитывать тем же выражением.»"

  - id: R-DIM-04
    title: "Высота рабочей поверхности и высота корпуса"
    rule: "«H_раб — 850 или 900 (ГОСТ 13025.1-85, табл. 6). H_корп = H_раб − h_опоры − t_столешницы. Выбор между 850 и 900: высота локтя пользователя минус 30–40 мм (Р). Значение H_корп AFABRIK не задаёт — это вопрос Q-01.»"
    params:
      H_раб: [850, 900]
      h_опоры: [100, 150]
      t_столешницы: {камень: [20, 40], компакт: 12, кедр_скиф: 38}
    calc:
      - {name: "H_корп при 850/100/38", expr: "H - leg - tw", vars: {H: 850, leg: 100, tw: 38}, expect: 712}
      - {name: "H_корп при 900/100/38", expr: "H - leg - tw", vars: {H: 900, leg: 100, tw: 38}, expect: 762}
      - {name: "H_корп при 900/150/38", expr: "H - leg - tw", vars: {H: 900, leg: 150, tw: 38}, expect: 712}
      - {name: "H_корп при 850/150/20", expr: "H - leg - tw", vars: {H: 850, leg: 150, tw: 20}, expect: 680}
    basis: [Н, Р, И]
    status: предложено
    src: [NR-01, IS-03, IS-04, IS-05, AF-01]
    afabrik: []
    needs: [H_раб, h_опоры, t_столешницы]
    note: "«Типовой корпус 720 мм из розничных источников даёт 858–910 мм (720 + 100…150 + 38…40) и выходит за 850/900 ГОСТ на 8–10 мм; для строгого соответствия использовать расчёт.»"

  - id: R-DIM-05
    title: "Верхний ряд: зазор над столешницей и верхний край"
    rule: "«Расстояние от рабочей поверхности до низа настенного шкафа не менее 450 мм (Н); рекомендуемое 500–600 (Р). Над варочной поверхностью — по паспорту вытяжки; при отсутствии паспорта не менее 750 (газ) и 700 (электро) (Р, источники расходятся: электро 600–750). Верхний край ряда — не выше роста пользователя более чем на 250 мм (Р).»"
    params:
      min_над_столешницей: 450
      рекомендуемо_над_столешницей: [500, 600]
      над_варкой_газ_min: 750
      над_варкой_электро_min: 700
    basis: [Н, Р]
    status: предложено
    src: [NR-01, IS-03, IS-04, IS-05]
    afabrik: []
    needs: [рост пользователя, тип варочной панели, паспорт вытяжки]
    note: "«Электро: IS-04 600–750, IS-03 700–750, IS-05 не менее 650 — принято консервативное 700 (X-12). Газ: все источники 750 и выше.»"

  - id: R-DIM-06
    title: "Глубина верхнего модуля"
    rule: "«D_корп верхнего модуля 320 + толщина фасада (K11); заказчик может задать другую глубину (S2). Для встроенной техники и вытяжки — не менее 400 (Р). ГОСТ даёт габарит 300 при допуске ±35 (Н).»"
    params:
      D_корп_верх: 320
      ГОСТ_габарит: 300
      ГОСТ_допуск: 35
      встроенная_техника_min: 400
    calc:
      - {name: "полный габарит верхнего модуля при фасаде 19", expr: "320 + t", vars: {t: 19}, expect: 339}
      - {name: "верхняя граница допуска ГОСТ", expr: "300 + 35", vars: {}, expect: 335}
    basis: [И, Н, Р]
    status: предложено
    src: [AF-01, NR-01, IS-03]
    afabrik: [K11]
    needs: [толщина фасада, задание клиента]
    note: "«339 мм (с фасадом 19) превышает верхнюю границу допуска ГОСТ 335 на 4 мм; если габарит ГОСТ относить только к корпусу (320), укладывается. AFABRIK старше ГОСТ (X-09).»"

  - id: R-DIM-07
    title: "Ширина фасада и зазоры"
    rule: "«Базовое правило: W_фасада = W_модуля − 3 (1,5 мм на сторону, K06). На стыке двух фасадов видимый шов 3 мм, на конце ряда у стены или торцевой панели 1,5 мм — пока C08 не решит иначе. Проверка: фактический шов F ≥ 2·L_min, где L_min — минимальный зазор выбранной петли для толщины двери и расстояния до чашки (R-HNG-07). При F=3 допустимо L_min ≤ 1,5.»"
    params:
      зазор_на_сторону: 1.5
      шов_между_фасадами: 3.0
    calc:
      - {name: "фасад модуля 600", expr: "W - 3", vars: {W: 600}, expect: 597}
      - {name: "фасад модуля 450", expr: "W - 3", vars: {W: 450}, expect: 447}
    basis: [И, П]
    status: предложено
    src: [AF-01, MD-01, BL-16]
    afabrik: [K06, C08]
    needs: [шаг модуля, таблица минимального зазора петли]
    note: "«Подтверждение: техсправка МДМ — ширина фасадов обычно на 3 мм меньше ширины корпуса (1,5+1,5), условие F > 2L. Розничные источники называют 2 мм на сторону — только если так требует таблица зазоров петли (X-04).»"

  - id: R-DIM-08
    title: "Ряд ширин модулей"
    rule: "«Предпочтительный ряд ширин (мм): 150, 200, 300, 400, 450, 500, 600, 800, 900; кратность 50. Ниши под технику — 450 или 600. Одностворчатая дверь — 300–500, двустворчатая — 600–1000. Более широкие ряды набирать из модулей и доборов, а не нестандартными корпусами. Минимальная ширина модуля с ящиками определяется адаптером системы (R-DRW-09).»"
    params:
      ряд: [150, 200, 300, 400, 450, 500, 600, 800, 900]
      кратность: 50
      одна_створка: [300, 500]
      две_створки: [600, 1000]
    basis: [Р, "?"]
    status: предложено
    src: [IS-03, IS-04, IS-05]
    afabrik: []
    needs: [решение владельца по ряду ширин (Q-04)]
    note: "«Источники расходятся в деталях (карго 200 есть только в IS-05; 150 — в IS-04). Ряд — предложение, не нормативное требование.»"

  - id: R-DIM-09
    title: "Верхний и нижний ряды согласованы по осям"
    rule: "«Ширины фасадов верхнего и нижнего рядов делать одинаковыми там, где это возможно; при несовпадении фиксировать причину (техника, вытяжка, угол).»"
    basis: [Р]
    status: предложено
    src: [IS-03]
    afabrik: []
    needs: []
    note: "«Правило внешнего вида, не прочности.»"

  - id: R-DIM-10
    title: "Точность расчётных размеров"
    rule: "«Размеры деталей ящиков и фасадов хранить с точностью 0,1 мм (формулы Hettich дают .5). Округлять только на этапе раскроя с учётом допуска системы (Unihopper: LW−35 и LW−38 с допуском +1/0).»"
    basis: [И, П]
    status: предложено
    src: [UH-02, HT-02]
    afabrik: []
    needs: []
    note: "«Допуски по умолчанию не назначать — брать из документа системы.»"

  # ===================== CAR: корпус и сборка =====================
  - id: R-CAR-01
    title: "Несущий материал и толщина боковины"
    rule: "«Корпус — ЛДСП 16–25 (S2); ХДФ не использовать как несущий материал корпуса (K03, C01). t_бок — параметр заказа: через LW он входит во все формулы фурнитуры.»"
    params:
      ЛДСП: [16, 25]
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K03, C01, C05]
    needs: [толщина боковины]
    note: "«Толщину не выбирать по пересечению диапазонов (C05).»"

  - id: R-CAR-02
    title: "Внутренние размеры корпуса"
    rule: "«LW = KB − 2·t_бок. LT = D_корп − k_зад, где k_зад — занятость задней стенки: 0 для накладной задней стенки; e + t_зад для стенки в пазу (e — отступ паза от заднего края, K12: 16 — база отсчёта уточняется в C09; принимать консервативно по ближней к краю кромке паза, т. е. e + t_зад = 16 + 4 = 20).»"
    params:
      k_зад: {накладная: 0, паз_4x8_отступ_16: 20}
    calc:
      - {name: "LW при KB 600, боковины 16", expr: "KB - 2*t", vars: {KB: 600, t: 16}, expect: 568}
      - {name: "LT нижний модуль 560, задняя в пазу", expr: "D - k", vars: {D: 560, k: 20}, expect: 540}
      - {name: "LT верхний модуль 320, задняя в пазу", expr: "D - k", vars: {D: 320, k: 20}, expect: 300}
      - {name: "LT нижний модуль 560, задняя накладная", expr: "D - k", vars: {D: 560, k: 0}, expect: 560}
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K03, K12, K13, K17, C01, C09]
    needs: [t_бок, тип задней стенки, база паза]
    note: "«Интерпретации паза 16 (до дальней кромки паза) дают k_зад = 16, до оси — 18; принято 20 как худший случай.»"

  - id: R-CAR-03
    title: "Максимальный NL по глубине корпуса"
    rule: "«NL_max = наибольшая стандартная длина системы, для которой NL + Δ_сист ≤ LT. Δ_сист берётся из адаптера: Blum 3; Hettich Atira 15 (ящик) и 24 (внутренний ящик); ArciTech 3, 12 или 21 по варианту (консервативно 21 до расшифровки). Если подходящей NL нет — менять тип задней стенки или систему, а не глубину корпуса молча.»"
    params:
      Δ_сист: {blum_legrabox: 3, blum_tandembox: 3, hettich_atira_ящик: 15, hettich_atira_внутр: 24, hettich_arcitech: [3, 12, 21]}
    calc:
      - {name: "LT_min Legrabox NL 500", expr: "NL + d", vars: {NL: 500, d: 3}, expect: 503}
      - {name: "LT_min Atira NL 520 ящик", expr: "NL + d", vars: {NL: 520, d: 15}, expect: 535}
    basis: [П, И]
    status: предложено
    src: [BL-04, BL-05, HT-01, HT-02, HT-03]
    afabrik: [K12, C03, C09]
    needs: [адаптер системы]
    note: "«Полные таблицы по системам — в 04-drawers.md; для Unihopper, Boyard, GTV Δ_сист не найден (D-02, D-04, D-05).»"

  - id: R-CAR-04
    title: "Варианты задней стенки"
    rule: "«Допустимы три варианта: (1) накладная ХДФ на задние торцы, (2) ХДФ в пазу 4×8, отступ 16 (K12), (3) ЛДСП (K13, K17). Для модулей с ящиками, где важна глубина, по умолчанию предпочитать вариант (1) — он не уменьшает LT. Конкретный вариант и толщина — решение заказа.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K03, K12, K13, K17, W05, C01]
    needs: [решение по задней стенке]
    note: "«Для верхнего модуля 320 паз даёт LT 300 против 320 у накладной стенки — это отсекает NL 300 у Hettich Atira (нужно 315) и оставляет NL 260/270.»"

  - id: R-CAR-05
    title: "Опоры и цоколь"
    rule: "«Опоры 100 или 150 (S2). Высота основания не менее 100, заглубление цоколя от фасада не менее 50 (Н). K09 (опоры заглублены на 70 спереди) удовлетворяет требованию заглубления ≥50 при условии, что 70 относится к цоколю, а не к оси опоры. Количество опор и нагрузку брать из паспорта опоры; не менее четырёх на модуль шириной до 600.»"
    params:
      h_опоры: [100, 150]
      основание_min: 100
      заглубление_min: 50
      заглубление_K09: 70
    basis: [Н, И]
    status: предложено
    src: [NR-01, AF-01]
    afabrik: [K09, W03, W04, C06, C07]
    needs: [модель опоры, паспорт]
    note: "«Число опор для широких модулей (более 600) в источниках не найдено — по паспорту опоры и нагрузке (D-09). Требование «не менее четырёх» — инженерная практика, не из источников.»"

  - id: R-CAR-06
    title: "Выравнивание по полу"
    rule: "«Если отклонение пола превышает 5–10 мм, учитывать регулировку цоколя и опор; ряд выставлять от наивысшей точки пола.»"
    basis: [Р, И]
    status: предложено
    src: [IS-04]
    afabrik: []
    needs: [обмер пола]
    note: "«Вторая часть (от высшей точки пола) — инженерная практика, в источниках явно не названа.»"

  - id: R-CAR-07
    title: "Кромка"
    rule: "«Кромка 1 мм на видимых частях, невидимые не кромятся (K04, K16); карта видимости строится по модели (C11). Дополнительно для деревянных деталей ящика по требованию системы Blum: дно кромится спереди и сзади, задняя стенка — сверху и снизу.»"
    params:
      кромка_видимая: 1
    basis: [И, П]
    status: предложено
    src: [AF-01, BL-02]
    afabrik: [K04, K16, C11]
    needs: [карта видимости]
    note: "«Требование к дну и задней стенке ящика взято из дистрибьюторской копии (Schachermayer) и подлежит проверке по MD-013/5.»"

  - id: R-CAR-08
    title: "Присадку не генерировать до закрытия C02 и C09"
    rule: "«Отступы 100 (петли), 50 (крепёж), 16 (паз), 70 (опоры), вырез 80×20 и угол 34×34 хранить как параметры с пометкой «база уточняется»; УП и схемы сверления не формировать, пока не заданы база отсчёта и крепёж.»"
    params:
      петли_от_края: 100
      крепёж_от_края: 50
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K05, K07, K08, K09, K10, K12, K15, C02, C09]
    needs: [решения C02, C09]
    note: "«Правило усиливает AFABRIK, не заменяет.»"

  - id: R-CAR-09
    title: "Навесные модули"
    rule: "«Навес и вырез под навес (K15: 80×20) подбирать по паспорту навеса: нагрузка на пару, ориентация, толщина панели. Несущую способность стены проверять отдельно от мебели.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K15, C09]
    needs: [модель навеса, материал стены]
    note: "«Нагрузки не назначать до выбора навеса.»"

  # ===================== FRN: фасады =====================
  - id: R-FRN-01
    title: "Требуемое наложение при накладном фасаде"
    rule: "«OL = t_бок − g_бок, где g_бок = 1,5 (зазор фасада на сторону, K06). Для полунакладной навески на общей стенке двух фасадов: OL = (t_бок − F)/2, где F = 3.»"
    params:
      g_бок: 1.5
      F: 3
    calc:
      - {name: "OL при боковине 16", expr: "t - g", vars: {t: 16, g: 1.5}, expect: 14.5}
      - {name: "OL при боковине 18", expr: "t - g", vars: {t: 18, g: 1.5}, expect: 16.5}
      - {name: "OL при боковине 19", expr: "t - g", vars: {t: 19, g: 1.5}, expect: 17.5}
      - {name: "OL полунакладная при 18", expr: "(t - F)/2", vars: {t: 18, F: 3}, expect: 7.5}
    basis: [И, П]
    status: предложено
    src: [MD-01, AF-01]
    afabrik: [K06, C08]
    needs: [t_бок]
    note: "«Пример из техсправки МДМ: фасад 16 на боковине 16 даёт наложение 14,5. Подбор высоты планки и расстояния до чашки по OL — R-HNG-05.»"

  - id: R-FRN-02
    title: "Вкладной фасад"
    rule: "«Ширина вкладного фасада = LW − 2·g_вкл, высота — аналогично. g_вкл не меньше минимального зазора петли и технологического допуска; ориентир 2 мм (Р). Внутри вкладного фасада нужна рамка или раскладка, обеспечивающая стабильную щель.»"
    params:
      g_вкл_ориентир: 2
    calc:
      - {name: "вкладной фасад при LW 568 и g=2", expr: "LW - 2*g", vars: {LW: 568, g: 2}, expect: 564}
    basis: [Р, "?"]
    status: предложено
    src: [MD-01]
    afabrik: [K06]
    needs: [решение владельца, таблица зазоров петли]
    note: "«Розничный ориентир 2 мм на сторону отличается от 1,5 мм AFABRIK (X-04): для вкладной навески g определяется петлёй.»"

  - id: R-FRN-03
    title: "Толщина фасада и тип петли"
    rule: "«Допустимая толщина двери определяется моделью петли: CLIP top BLUMOTION 110° и 110°+ — до 26; 155° с нулевым вхождением — до 24; 125° с нулевым вхождением — до 30; 95° для толстых дверей — до 30; 107/120/120°+ — до 22; 170° — до 24; тонкие двери 8–14 — петли с EXPANDO T. Фасады AFABRIK 16–22 укладываются в 110°.»"
    params:
      blum_предел_толщины: {"110": 26, "110+": 26, "155_нулевое_вхождение": 24, "125_нулевое_вхождение": 30, "95_толстая": 30, "107_120": 22, "170": 24, "тонкие": [8, 14]}
    basis: [П, Р]
    status: предложено
    src: [BL-23, BL-20, BL-16]
    afabrik: []
    needs: [модель петли]
    note: "«Предельные значения взяты из дилерской таблицы (BL-23), подтверждены только для 110° (BL-16: до 24 для новой 110° — X-14). Для выпуска — по каталогу Blum.»"

  - id: R-FRN-04
    title: "Масса фасада"
    rule: "«Массу фасада считать как площадь × толщина × плотность плюс масса ручки. Плотности для планирования (Hettich): ЛДСП 700 кг/м³, МДФ 900 кг/м³; паспорт материала старше. Массу использовать для числа петель (R-HNG-02) и подбора подъёмника (R-LFT-02). Масса — отдельное поле детали, не производное «на глаз».»"
    params:
      плотность_кг_м3: {лдсп: 700, мдф: 900}
    calc:
      - {name: "фасад ЛДСП 18 мм 600×720 без ручки", expr: "A * t * rho", vars: {A: 0.432, t: 0.018, rho: 700}, expect: 5.4432}
    basis: [И, П]
    status: предложено
    src: [BL-19, HT-05]
    afabrik: []
    needs: [материал фасада, плотность, ручка]
    note: "«Blum: масса двери учитывается вместе с ручкой.»"

  - id: R-FRN-05
    title: "Раскладка фасадов ящиков по высоте"
    rule: "«Для стопки из n фасадов в модуле высотой H_корп: Σh_i = H_корп − 3·n (1,5 мм сверху у крышки и снизу, 3 мм между фасадами). Минимальные высоты фасадов Blum LEGRABOX: M ≥ 68, K ≥ 106, C ≥ 155, F ≥ 219 (по документу, значения подлежат проверке).»"
    params:
      min_высота_фасада_legrabox: {M: 68, K: 106, C: 155, F: 219}
    calc:
      - {name: "сумма высот трёх фасадов в модуле 712", expr: "H - 3*n", vars: {H: 712, n: 3}, expect: 703}
      - {name: "сумма высот двух фасадов в модуле 712", expr: "H - 3*n", vars: {H: 712, n: 2}, expect: 706}
    basis: [И, П]
    status: предложено
    src: [AF-01, BL-05]
    afabrik: [K06, C08]
    needs: [H_корп, число ящиков]
    note: "«При Gola или другом профиле сумму уменьшать на высоту профиля (R-GLA-02).»"

  - id: R-FRN-06
    title: "Push-механизмы и зазор фасада"
    rule: "«Зазор фасада у систем Push/TIP-ON задаётся системой: Blum TIP-ON для LEGRABOX — не менее 2,5 (3,5 с синхронизацией); Hettich Push to open Silent — 2,5–5. Заглубление корпуса 4 мм при типоне (K18) — гипотеза AFABRIK, на другие системы не переносить (C10).»"
    params:
      зазор_tipon: 2.5
      зазор_tipon_синхр: 3.5
      зазор_hettich_push: [2.5, 5]
    basis: [П, И]
    status: предложено
    src: [BL-04, BL-05, BL-06, HT-02, AF-01]
    afabrik: [K18, C10]
    needs: [система открывания]
    note: "«Для TANDEMBOX antaro зазор фасад–корпус 2,5; для ArciTech Push to open Silent 2,5–5.»"

  - id: R-FRN-07
    title: "Тонкие и композитные фасады"
    rule: "«Для фасадов тоньше 16, из камня, керамики, HPL: крепление EXPANDO T — от 8 мм; отверстие Ø10 (допуск +0,1/−0,1; для камня и керамики +0,2/−0,1), глубина не менее 6; на ширину корпуса более 600 — 1 шт., более 900 — 2 шт., при высоте фасада более 380 — 1 шт. Blum не отвечает за узлы из материалов вне списка и в сочетании с фурнитурой других производителей.»"
    params:
      толщина_от: 8
      сверло: 10
      глубина_min: 6
      количество: {KB_более_600: 1, KB_более_900: 2, FH_более_380: 1}
    basis: [П]
    status: предложено
    src: [BL-20]
    afabrik: []
    needs: [материал фасада]
    note: "«Применимо к AVENTOS HS, HL, HK top; петлям CLIP top (BLUMOTION); ящикам LEGRABOX и MERIVOBOX.»"

  # ===================== HNG: петли =====================
  - id: R-HNG-01
    title: "Выбор типа петли"
    rule: "«Тип петли выбирать последовательно: 1) наложение (накладная, полунакладная, вкладная), 2) угол открывания, 3) толщина двери, 4) соседство с ящиками за дверью (при ящиках за дверью — петли с нулевым вхождением 155°), 5) способ закрывания (soft close, push). Подбирать петлю и планку одного производителя.»"
    basis: [И, П]
    status: предложено
    src: [BL-09, BL-17, HT-04, BY-01]
    afabrik: [K07]
    needs: [тип наложения, толщина двери]
    note: "«Boyard: фильтр по углу установки 90/135/180, углу открывания 90–155, чашке 26 или 35, высоте планки 0/2/4, типу наложения.»"

  - id: R-HNG-02
    title: "Число петель по массе фасада (Blum)"
    rule: "«Для ширины фасада до 600: 4–6 кг — 2; 6–12 — 3; 12–17 — 4; 17–22 — 5; 22–27 — 6; 27–32 — 7 петель. При ширине 600–650 добавить 1. Масса включает ручку. Для высоких узких дверей допускается 3 петли и при 6 кг. Свыше 32 кг, шире 650 или по высоте свыше нормы — по паспорту/опытному образцу.»"
    params:
      по_массе_кг: [[6, 2], [12, 3], [17, 4], [22, 5], [27, 6], [32, 7]]
      ширина_до: 600
      добавка_650: 1
    calc:
      - {name: "фасад 9 кг, ширина 570", expr: "3", vars: {}, expect: 3}
      - {name: "фасад 19 кг, ширина 620", expr: "5 + 1", vars: {}, expect: 6}
    basis: [П]
    status: предложено
    src: [BL-19, BL-18, BL-22, BL-09]
    afabrik: [K07]
    needs: [масса фасада, ширина]
    note: "«Серия 2/3/4/5/6/7 собрана из нескольких документов Blum (BL-19: 2 и 3; BL-09: 4–6, 6–12, 12–17, 17–22; BL-18 и BL-22: 5, 6, 7 при 22/27/32 кг).»"

  - id: R-HNG-03
    title: "Число петель по высоте двери (резервное правило)"
    rule: "«Если масса неизвестна, ориентироваться на высоту двери: до 900 — 2; 900–1600 — 3; 1600–2000 — 4; 2000–2400 — 5 петель. Этот ряд — Р; при расхождении с R-HNG-02 берётся большее число петель.»"
    params:
      по_высоте_мм: [[900, 2], [1600, 3], [2000, 4], [2400, 5]]
    basis: [Р]
    status: предложено
    src: [MD-01]
    afabrik: []
    needs: [высота двери]
    note: "«Диапазоны высот 90/90–160/160–200/200–240 см взяты из таблицы МДМ (Ferrari), сопоставление с числами 2/3/4/5 восстановлено не однозначно (X-05).»"

  - id: R-HNG-04
    title: "Расстановка петель"
    rule: "«Крайние петли — на 100 мм от кромок двери (K07, база отсчёта уточняется), промежуточные — равномерно; расстояние между верхней и нижней петлями должно быть как можно большим и превышать ширину двери (Р).»"
    params:
      от_кромки: 100
    basis: [И, П, Р]
    status: предложено
    src: [AF-01, BL-18, BL-23]
    afabrik: [K07, C09]
    needs: [высота двери]
    note: "«Требование «больше ширины двери» — дилерская справка Blum; не заменяет таблицу производителя.»"

  - id: R-HNG-05
    title: "Подбор наложения: расстояние до чашки TB и высота планки H"
    rule: "«Для CLIP top BLUMOTION 110°: OL = X + TB − H, где X = 11 (110°) или 13 (110°+), TB — расстояние от края двери до чашки (3–7), H — высота планки (0/3/6/9). Подбирать TB и H так, чтобы OL совпало с требуемым из R-FRN-01. Для Boyard расстояние до центра чашки 21,5–24,5 (K = 4–7 при Ø35). Формулу и таблицы подтверждать по каталогу выбранной петли.»"
    params:
      X: {"110": 11, "110+": 13}
      TB: [3, 7]
      H_планки: [0, 3, 6, 9]
    calc:
      - {name: "TB для OL 14,5 при 110°, H=0", expr: "OL - X + H", vars: {OL: 14.5, X: 11, H: 0}, expect: 3.5}
      - {name: "TB для OL 16,5 при 110°, H=0", expr: "OL - X + H", vars: {OL: 16.5, X: 11, H: 0}, expect: 5.5}
    basis: [П]
    status: предложено
    src: [BL-16, BL-18, BY-02]
    afabrik: [K07]
    needs: [модель петли, OL, t_бок]
    note: "«Формула и значения X получены в сессии из каталога Blum; таблицы наложения в извлечённых копиях искажены, поэтому правило помечено к сверке (D-03). Не использовать для выпуска без каталожной таблицы.»"

  - id: R-HNG-06
    title: "Чашка и крепёж"
    rule: "«Чашка Ø35; глубина 12,8–13 (Hettich Sensys 12,8; Blum — достаточно 13). Остаток материала под чашкой не менее 3 (инженерная проверка: t_фасада − глубина ≥ 3). Для тонких дверей 8–14 — чашка Ø10 глубиной не менее 6 (EXPANDO T). Планка: горизонтальная 20/32 или крестообразная 37/32 (сетка 32).»"
    params:
      чашка_диаметр: 35
      глубина: [12.8, 13]
      остаток_min: 3
    calc:
      - {name: "остаток под чашкой при фасаде 16 и глубине 13", expr: "t - d", vars: {t: 16, d: 13}, expect: 3}
    basis: [П, И]
    status: предложено
    src: [HT-04, BL-16, BL-18, BL-20]
    afabrik: [K07, K08]
    needs: [модель петли]
    note: "«Остаток 3 мм — предложение (в источниках не нормируется).»"

  - id: R-HNG-07
    title: "Минимальный зазор L"
    rule: "«Минимальный зазор L зависит от толщины двери, расстояния до чашки и радиуса кромки двери; для двух смежных дверей фактический шов F > 2·L (МДМ) / F ≥ 2·L (принято). Blum CLIP top BLUMOTION 110°, дверь 16, R=1: 0,5 мм. EXPANDO T: всегда 0. L из таблицы петли не округлять вниз.»"
    params:
      L_blum_110_16: 0.5
    basis: [П]
    status: предложено
    src: [BL-16, BL-20, MD-01]
    afabrik: [K06, C08]
    needs: [таблица зазоров]
    note: "«Полные таблицы L по толщинам 16–32 в извлечённых копиях искажены (D-03).»"

  - id: R-HNG-08
    title: "Регулировка и запас"
    rule: "«Не использовать весь диапазон регулировки при проектировании: Blum — боковая ±2 (кулачок) или ±3 (продолговатое отверстие), по глубине +3/−2; Hettich Sensys — +3/−2. Расчётные зазоры закладывать на нулевой регулировке.»"
    params:
      blum_боковая: [2, 3]
      глубина: {плюс: 3, минус: 2}
    basis: [П]
    status: предложено
    src: [BL-16, BL-18, HT-04]
    afabrik: []
    needs: []
    note: "«Регулировка — для компенсации монтажных допусков, не для проектного размера.»"

  - id: R-HNG-09
    title: "Петли с нулевым вхождением 155°"
    rule: "«Петля 155° с нулевым вхождением нужна, если за дверью расположены ящики или дверь должна полностью освободить проём; она использует всю ширину корпуса. Требует планку с подъёмом 9 и допускает дверь до 24. Ограничитель 110° или 92°.»"
