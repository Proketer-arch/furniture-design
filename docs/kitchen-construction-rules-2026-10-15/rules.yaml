  - id: R-ASM-10
    title: "Границы положительного результата"
    rule: "«Раздельно сообщать результаты генератора модулей, сборки, кинематики, состава/стоимости, сохранения и проверки производства. Ожидаемую геометрию получать из требований независимо от экспортёра. При дефекте либо непроверенном обязательном узле не объявлять модель полностью проверенной.»"
