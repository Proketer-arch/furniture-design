    rule: "«LF = KH [мм] × m_фасада с ручкой [кг]; для HK top и HK-S — с двойной массой ручки. Силовой механизм подбирать по таблице LF для выбранного типа. Стандартно два механизма (симметричные); третий увеличивает допустимый LF примерно на 50 %. HK top: максимальная масса фасада 18 кг при двух механизмах.»"
    calc:
      - {name: "LF для KH 600 и фасада 8 кг (HK-XS)", expr: "KH * m", vars: {KH: 600, m: 8}, expect: 4800}
      - {name: "LF для KH 720 и фасада 14 кг (HF)", expr: "KH * m", vars: {KH: 720, m: 14}, expect: 10080}
    basis: [П]
    status: предложено
    src: [BL-10, BL-11, BL-12]
    afabrik: [K19]
