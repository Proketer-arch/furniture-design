  - id: R-HNG-11
    title: "Hettich Sensys и Boyard EVO как адаптеры"
    rule: "«Hettich Sensys: чашка Ø35, глубина 12,8, толщина двери 10–32 (по модели), зазор C 3–8 (по модели), регулировка +3/−2. Boyard EVO: чашка Ø35, 93°, версии с доводчиком и PUSH, панели 15–26, ресурс 100 000 циклов. Геометрию наложения для обеих систем подтверждать по каталогам (Hettich TuI; Boyard 2024, стр. 2–50 и 96).»"
    params:
