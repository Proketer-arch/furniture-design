        "18": [0.8, 0.8, 0.8, 0.8, 0.8]
        "19": [1.0, 1.0, 0.9, 0.9, 0.9]
        "20": [1.2, 1.2, 1.2, 1.2, 1.1]
        "21": [1.5, 1.4, 1.4, 1.3, 1.3]
        "22": [1.8, 1.7, 1.7, 1.6, 1.6]
        "23": [2.2, 2.0, 2.0, 1.9, 1.9]
        "24": [2.7, 2.5, 2.4, 2.3, 2.2]
        "25": [3.5, 3.1, 2.9, 2.7, 2.6]
        "26": [4.3, 3.8, 3.4, 3.2, 3.0]
      прибавка_боковая_регулировка_плюс2: {"16": 0.2, "18": 0.4, "19": 0.4, "20": 0.5, "21": 0.5, "22": 0.5}
    calc:
      - {name: "шов для двери 19 при TB 5 (2·L)", expr: "2 * L", vars: {L: 0.9}, expect: 1.8}
      - {name: "шов для двери 21 при TB 3 (2·L)", expr: "2 * L", vars: {L: 1.5}, expect: 3.0}
      - {name: "шов для двери 22 при TB 5 (2·L)", expr: "2 * L", vars: {L: 1.7}, expect: 3.4}
    basis: [П]
    status: предложено
    src: [BL-16, BL-20, BL-27, MD-01]
