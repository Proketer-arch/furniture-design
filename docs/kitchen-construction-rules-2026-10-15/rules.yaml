    calc:
      - {name: "остаток под чашкой при фасаде 16 и глубине 13", expr: "t - d", vars: {t: 16, d: 13}, expect: 3}
    basis: [П, И]
    status: предложено
    src: [HT-04, BL-16, BL-18, BL-20]
    afabrik: [K07, K08]
    needs: [модель петли]
    note: "«Остаток 3 мм — предложение (в источниках не нормируется).»"

  - id: R-HNG-07
    title: "Минимальный зазор L"
    rule: "«Минимальный зазор L зависит от толщины двери, расстояния до чашки TB и радиуса кромки двери. Blum CLIP top BLUMOTION 110°, R = 1, TB 3 / 4 / 5 / 6 / 7: толщина 16 — 0,5 при любом TB; 18 — 0,8; 19 — 1,0 / 1,0 / 0,9 / 0,9 / 0,9; 20 — 1,2 / 1,2 / 1,2 / 1,2 / 1,1; 21 — 1,5 / 1,4 / 1,4 / 1,3 / 1,3; 22 — 1,8 / 1,7 / 1,7 / 1,6 / 1,6; 23 — 2,2 / 2,0 / 2,0 / 1,9 / 1,9; 24 — 2,7 / 2,5 / 2,4 / 2,3 / 2,2; 25 — 3,5 / 3,1 / 2,9 / 2,7 / 2,6; 26 — 4,3 / 3,8 / 3,4 / 3,2 / 3,0. При боковой регулировке +2 прибавить 0,2 (16), 0,4 (18, 19), 0,5 (20–22). Для двух смежных дверей фактический шов F ≥ 2·L (принято; МДМ: F > 2·L): шов 3 мм достаточен при толщине 16–21 мм, начиная с 22 мм шов нужно увеличивать до 2·L. Петля 155°: толщина 20–24 — 0; 25 — 0,5 (TB 3–5) / 1,0 (TB 6–8); 26 — 0,5–1,5; 27 — 1,0–2,5. EXPANDO T: всегда 0. L из таблицы петли не округлять вниз.»"
    params:
      L_blum_110_R1_TB3_7:
