  - id: R-ASM-07
    title: "Зависимости и повторная приёмка после изменения"
    rule: "«После изменения параметра обновить зависимые размеры и отменить прежние результаты затронутых проверок. Учитывать межмодульные зависимости: глубина/зазор — столешница и фартук; ширина/боковины — ряд, верх и цоколь; боковина до пола — маршрут цоколя и опоры; механизм — ход и доступ.»"
