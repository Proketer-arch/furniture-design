  - id: R-LFT-10
    title: "AVENTOS HK top, HK-S, HK-XS: размеры присадки и пределы по EP-609/3"
    rule: "«В обозначениях документа EP-609/3: HK top — Y = FH · 0,29 + FD − SOB; HK-XS — Y = (FH − X) × 0,3 и H = 137 + MD + K + SOB; расстояние X при толщине фасада FD 16 / 19 / 22 / 24 равно 45 / 34 / 23 / 15. SOB (толщина верхней панели) для HK-S не более 22. FAo — наложение фасада сверху, не более 25,4 (это не толщина крышки корпуса). HK top: максимальная масса фасада 18 кг при двух механизмах. Расшифровку Y, MD, K брать по документу.»"
    params:
      HK_top_Y: "FH * 0.29 + FD - SOB"
      HK_XS_H: "137 + MD + K + SOB"
      HK_XS_X_по_FD: {"16": 45, "19": 34, "22": 23, "24": 15}
      HK_S_SOB_max: 22
      FAo_max: 25.4
      HK_top_масса_кг_два_механизма: 18
    calc:
      - {name: "HK top: Y при FH 400, FD 16, SOB 16", expr: "FH * 0.29 + FD - SOB", vars: {FH: 400, FD: 16, SOB: 16}, expect: 116}
    basis: [П]
    status: предложено
    src: [BL-28]
    afabrik: [K19]
    needs: [тип подъёмника, FH, FD, SOB]
    note: "«X-13 закрыт: «макс. 25,4» — это FAo (наложение фасада сверху), а не предел толщины крышки; толщину крышки (SOB) ограничивает только HK-S (22). Формулы взяты из текста EP-609/3; для выпуска проверять по таблице присадки конкретного подъёмника.»"

