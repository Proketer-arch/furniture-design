    note: "«При несовпадении нельзя объявлять параметрическую редактируемость и ведомость проверенными; сначала установить действующую редакцию.»"

  - id: R-ASM-09
    title: "Измеримая приёмка сборки на стадии дизайна"
    rule: "«Проверить общие цепи, план столешницы/фартука, сечение цоколя с опорами и боковинами, оба стыка с пеналами, сложные углы и подвижные части. Для узла записать редакцию, ID, требование, метод, ожидаемое, фактическое, результат и вид/файл. Выбирать виды, показывающие измеряемый узел.»"
