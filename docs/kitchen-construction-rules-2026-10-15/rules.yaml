    note: "«632 — пример выбранного обрамления, не универсальный модуль/фасад ПММ. Изменение наружной ширины затрагивает ряд, верх, столешницу, фартук, цоколь и ведомости; панели учитывать один раз.»"

  - id: R-ASM-06
    title: "Раздельная проверка примыканий, коллизий и движения"
    rule: "«Проверять нежелательные разрывы, непредусмотренные пересечения и движение раздельно. Ограничивающие боксы использовать для отбора; коллизию подтвердить контуром, сечением или реальным объёмом. Допустимый контакт/нахлёст ограничить конкретным узлом. Проверять закрытое, промежуточные и крайние положения, доступ и возврат.»"
    basis: [И]
    status: предложено
    src: [QA-01]
