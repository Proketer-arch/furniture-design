    basis: [И, Р]
    status: предложено
    src: [AF-01, IS-03]
    afabrik: [K14, K17, K18, K19, C04, C10, C12]
    needs: [высота потолка, уровень (C12)]
    note: "«Размеры антресоли — вопрос заказа; формулы фурнитуры из DRW/LFT работают на её LT и KH.»"

  - id: R-MOD-13
    title: "Добор и торцевая панель"
    rule: "«Добор между модулем и стеной: W_добора = замеренный зазор − g, где g — зазор до соседнего фасада (1,5) и до стены по условию установки; добор сначала проверять на возможность установки петли и ручки (по паспорту). Торцевая панель закрывает видимый торец; её кромка и толщина — по карте видимости (K04, C11).»"
