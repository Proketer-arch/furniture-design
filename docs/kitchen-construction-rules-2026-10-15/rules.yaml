    basis: [Р, П]
    status: предложено
    src: [MK-02, MK-05, BY-01, UH-01]
    afabrik: []
    needs: [паспорт]
    note: "«Значения ресурса разных производителей получены по разным методикам; блог 2026 года даёт для Blum и Hettich «от 80 000», для Boyard 40 000–60 000 (X-22).»"
