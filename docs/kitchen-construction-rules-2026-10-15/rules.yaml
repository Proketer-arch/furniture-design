  # ===================== ASM: сборка проекта и приёмка =====================
  - id: R-ASM-01
    title: "Проверка всей сборки после генерации модулей"
    rule: "«Для проекта хранить ID, роли, иерархию, локальные размеры, мировые преобразования и редакцию объектов. Привязки задавать к обозначенным базам со смещениями и зависимостями. После расстановки проверять сборку целиком, включая объекты вне сметы и созданные отдельным скриптом.»"
    basis: [И]
    status: предложено
    src: [QA-01]
    afabrik: []
    needs: [состав сборки, базы и привязки]
    note: "«Исправность отдельных модулей не подтверждает стыки между ними. При тесте расширения построение/пересчёт проверять через его интерфейс или поддерживаемый API; указывать происхождение частей: расширение, отдельный скрипт или ручная правка. Свои плоскости не доказывают работу расширения.»"

  - id: R-ASM-02
    title: "Конструктивная, монтажная и видимая глубины"
    rule: "«Разделять глубину корпуса, цепь от стены и глубину видимой облицовки. Обозначать плоскости стены, корпуса, фасада, фартука, боковин и столешницы. Подтверждённый внешний задний зазор сохранять; свес считать по положению кромки относительно фасада в общей системе координат.»"
    calc:
      - {name: "монтажная цепь с внешним зазором 50, корпусом 560, фасадом 19", expr: "g + d + t", vars: {g: 50, d: 560, t: 19}, expect: 629}
    basis: [И]
    status: предложено
    src: [QA-01, AF-01]
    afabrik: [K01, K02, C03]
    needs: [решение о заднем зазоре, плоскости и направление оси глубины]
    note: "«Типовой размер столешницы не переопределяет подтверждённую базу. Числа примера не назначаются всем заказам.»"

  - id: R-ASM-03
    title: "Заданный стык фартука с внутренними боковинами"
    rule: "«Для каждого видимого стыка задать поверхности двух объектов, вид узла, проектный размер/допуск и границы. Фартук у пенала проверять по глубине, ширине и высоте: открытой технической полости без выбранного закрытия быть не должно. Наружная панель не заменяет внутренний узел.»"
    calc:
      - {name: "непредусмотренный разрыв по глубине в примере аудита", expr: "a - b", vars: {a: 621, b: 580}, expect: 41}
    basis: [И]
    status: предложено
    src: [QA-01]
    afabrik: []
    needs: [поверхности и размеры стыка, решение о закрытии]
    note: "«Контакт, монтажный шов, теневой зазор, нахлёст или добор выбираются для узла. Совпадение торцов по X не доказывает примыкание по глубине; универсального положения фартука нет.»"

  - id: R-ASM-04
    title: "Маршрут цоколя и совместимость с опорами"
    rule: "«Цоколь задавать сегментами с высотой, толщиной, лицевой/задней поверхностью, стыками, возвратами и креплениями. Различать отступ цоколя и ось опоры; учитывать контур опоры и клипсу. Проверять боковины до пола, перегородки, вентиляцию и ход двери ПММ. Для препятствия выбрать разрыв, вырез либо другую согласованную конструкцию.»"
    calc:
      - {name: "объём пересечения сплошных прямоугольных деталей в примере, мм3", expr: "w * d * h", vars: {w: 16, d: 18, h: 97}, expect: 27936}
    basis: [И]
    status: предложено
    src: [QA-01]
    afabrik: [K09, W03, W04, C06, C07]
    needs: [маршрут, боковины до пола, контур опоры и крепление, пол, кинематика ПММ]
    note: "«Ни постоянная координата, ни один отступ от фасада не обеспечивают совместимость. Пересечение допускается только в явно заданном узле крепления; не исключать все опоры из проверки.»"

  - id: R-ASM-05
    title: "Варианты обрамления ПММ и пересчёт ряда"
    rule: "«Выбрать соседние корпуса, собственные или общие боковины ПММ, назначить владельца каждой панели и верхнюю стяжку/горизонт. Свободный проём считать после панелей и выступов, фасад — по паспорту и раскладке. Цельный горизонт проверять по установочной высоте; обычные царги под столешницей не заменять крышкой без решения заказа.»"
    calc:
      - {name: "наружная ширина при чистом проёме 600 и двух собственных боковинах 16", expr: "n + 2*t", vars: {n: 600, t: 16}, expect: 632}
    basis: [И]
    status: предложено
    src: [QA-01]
    afabrik: []
