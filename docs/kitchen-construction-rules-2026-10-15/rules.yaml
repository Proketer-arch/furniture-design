    afabrik: [K19]
    needs: [KB, масса фасада]
    note: "«Для HK-S число петель в источниках однозначно не привязано.»"

  - id: R-LFT-05
    title: "HF top: формула высоты и рамочные фасады"
    rule: "«Для двух равных створок KH = 2·FHo + F1 + F2 + F3 (F — зазоры). Алюминиевые рамки шириной менее 57 — только крестообразные планки; рамка от 20,5 мм требует регулировки зазора. Hettich HF: шарнир не менее 110° (Sensys 8645i, Intermat 9943), створки с формулой J = U − (H − B + 3) для равных створок.»"
    basis: [П]
    status: предложено
    src: [BL-10, BL-11, HT-05]
    afabrik: [K19]
    needs: [высота створок, зазоры]
    note: "«Присадочные таблицы Hettich HF по высоте в свету — в BL/HT документах (HT-05); здесь не копируются.»"

  - id: R-LFT-06
    title: "HS top и HL top: масса фасада по высоте корпуса"
    rule: "«HS top (масса фасада FG, кг): KH 350–450 — 2,00–11,50; 450–540 — 2,50–12,50; 480–660 — 2,75–15,25; 650–800 — 3,50–18,50. HL top: KH 300–339 — 1,50–9,00; 340–389 — 1,75–10,00; 390–540 — 2,00–12,25; 480–580 — 2,50–14,00. Для HL при внутренней ширине ≥ 1190 — поперечный стабилизатор. При ширине рамки 19 наложение на боковины 11–18.»"
    params:
      HS_FG: [[350, 450, 2.00, 11.50], [450, 540, 2.50, 12.50], [480, 660, 2.75, 15.25], [650, 800, 3.50, 18.50]]
      HL_FG: [[300, 339, 1.50, 9.00], [340, 389, 1.75, 10.00], [390, 540, 2.00, 12.25], [480, 580, 2.50, 14.00]]
      HL_стабилизатор_LW_от: 1190
    basis: [П]
    status: предложено
    src: [BL-10, BL-11]
    afabrik: [K19]
    needs: [KH, масса фасада]
    note: "«Диапазоны KH в таблицах пересекаются (HS 450–540 и 480–660): строки сохранены как в источнике, при пересечении брать более строгий диапазон массы (X-11).»"

  - id: R-LFT-07
    title: "Hettich Lift Advanced: газовые пружины и масса створки"
    rule: "«Комплект газовых пружин — 2 шт.; усилие подбирается по массе створки и высоте корпуса в свету (150–650 Н). Если таблица допускает две пружины, брать более сильную. Масса створки считается по ЛДСП 19 мм = 700 кг/м³, МДФ 19 мм = 900 кг/м³ с коэффициентом толщины: 15 — 0,79; 16 — 0,84; 18 — 0,95; 19 — 1,00; 20 — 1,05; 22 — 1,16; 23 — 1,21; 26 — 1,37; 29 — 1,53. Масса створки с ручкой: HF 3,8–15,4; HK 2,0–17,9; HL 1,7–17,6; HS 2,5–15,3 кг. Поперечные стяжки HL/HS — для ширины 600, 1200, 1800.»"
    params:
      пружин: 2
      усилие_Н: [150, 650]
      плотность_кг_м3: {лдсп_19: 700, мдф_19: 900}
      коэффициент_толщины: {"15": 0.79, "16": 0.84, "18": 0.95, "19": 1.00, "20": 1.05, "22": 1.16, "23": 1.21, "26": 1.37, "29": 1.53}
      масса_створки_кг: {HF: [3.8, 15.4], HK: [2.0, 17.9], HL: [1.7, 17.6], HS: [2.5, 15.3]}
    calc:
      - {name: "масса ЛДСП 18 мм, 0,432 м² (600×720)", expr: "A * 0.019 * 700 * 0.95", vars: {A: 0.432}, expect: 5.45832}
    basis: [П]
    status: предложено
    src: [HT-05]
    afabrik: [K19]
    needs: [высота в свету, масса створки]
    note: "«Полная таблица подбора пружин для HK (276–720) в HT-05: например, 300 Н при 361–480 мм: 5,7–7,9 кг. Для HF/HL/HS таблицы в том же каталоге.»"

  - id: R-LFT-08
    title: "Boyard и поставщик: газовые лифты"
    rule: "«Boyard GL102, GL105, GL107 — газовые лифты с обычным ходом; фасады типа HF (складные) не предусмотрены. МДМ K12: длины 164, 244, 355; усилие 50–180 Н; 1–4 штуки на фасад; высота фасада 200–600; масса двери 1–18 кг; толщина фасада 16 и 18; данные опытные, перед серией — опытный образец.»"
