    afabrik: []
    needs: []
    note: "«Конкретные документы, которых не хватает, перечислены в D-реестре.»"

  - id: R-SUP-07
    title: "Ресурс и класс системы"
    rule: "«Класс фурнитуры выбирать по ожидаемой нагрузке и ресурсу: Blum до 200 000 циклов, Hettich до 160 000, аналоги 60 000–120 000 (Р, источник маркетинговый); Boyard EVO 100 000; Unihopper скрытые направляющие 60 000 (TÜV). Цифры ресурса не использовать как расчётное основание без паспорта.»"
    params:
