      boyard_evo: {чашка: 35, угол: 93, панели: [15, 26], ресурс: 100000}
    basis: [П]
    status: предложено
    src: [HT-04, BY-01, BY-02]
    afabrik: []
    needs: [решение по системе]
    note: "«Размерные таблицы Hettich и Boyard по наложению прочитаны не полностью (D-01, D-04).»"

  # ===================== DRW: ящики =====================
  - id: R-DRW-01
    title: "Адаптер системы ящиков: что обязательно хранить"
    rule: "«Для выбранной системы ящиков хранить: ряд NL; Δ_сист = LT_min − NL; формулы длины и ширины дна и задней стенки; ширину монтажа EB (для двойных боковин); высоту боковины; нагрузку; зазор фасада; схему присадки; условия синхронизации. Ящик без адаптера в модель выпуска не включается.»"
    basis: [И, П]
    status: предложено
    src: [BL-04, BL-06, HT-01, HT-02, UH-02, GT-01]
    afabrik: [W10]
    needs: [выбор системы (Q-02)]
    note: "«Нехватку данных регистрировать в D-реестре, а не восполнять догадкой.»"

  - id: R-DRW-02
    title: "Адаптер Blum LEGRABOX (pure, free)"
    rule: "«Высоты боковин: N 66,5; M 90,5; K 128,5; C 177; F 241. NL 270–650 (40 кг — 270–600; 70 кг — 450–650). LT_min = NL + 3. Дно ЛДСП 16: ширина LW − 35 (принято), длина NL − 10 (задняя стенка ЛДСП) или NL − 21 (стальная задняя стенка/ящик под мойку); задняя стенка: ширина LW − 38 (принято). Зазор TIP-ON: 2,5; с синхронизацией 3,5. Синхронизация: LW ≥ 294 (тяга); LW 245–293 (однодетальная).»"
    params:
      высота_боковины: {N: 66.5, M: 90.5, K: 128.5, C: 177, F: 241}
      NL_ряд: [270, 300, 350, 400, 450, 500, 550, 600, 650]
      нагрузка_кг: {"40": [270, 600], "70": [450, 650]}
      Δ_сист: 3
      ширина_дна: "LW - 35"
      ширина_задней: "LW - 38"
      длина_дна: {задняя_лдсп: "NL - 10", задняя_сталь: "NL - 21"}
      зазор_tipon: {обычный: 2.5, синхр: 3.5}
      синхр_LW: {тяга_от: 294, однодетальная: [245, 293]}
    calc:
      - {name: "ширина дна при LW 568", expr: "LW - 35", vars: {LW: 568}, expect: 533}
      - {name: "ширина задней при LW 568", expr: "LW - 38", vars: {LW: 568}, expect: 530}
      - {name: "длина дна при NL 500 (задняя ЛДСП)", expr: "NL - 10", vars: {NL: 500}, expect: 490}
    basis: [П]
    status: предложено
    src: [BL-01, BL-02, BL-03, BL-04, BL-05, UH-02]
