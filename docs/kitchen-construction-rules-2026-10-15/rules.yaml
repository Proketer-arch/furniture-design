    title: "Минимальная внутренняя глубина корпуса под подъёмник"
    rule: "«Минимальная LT: HF top, HS top, HL top — 264; HK top — 187 (261 при видимых навесках); HK-S — 163 (240 при видимых навесках); HK-XS — 125 (100 при специальной присадке; 200 при видимых навесках). Hettich Lift Advanced — 182 для всех четырёх типов. Если серия Blum не уточнена, для HF/HS/HL брать консервативные 278/276/278 из обзорного документа.»"
    params:
      aventos_LT_min: {HF_top: 264, HS_top: 264, HL_top: 264, HK_top: 187, HK_top_видимые_навески: 261, HK_S: 163, HK_S_видимые_навески: 240, HK_XS: 125, HK_XS_специальная: 100, HK_XS_видимые_навески: 200}
