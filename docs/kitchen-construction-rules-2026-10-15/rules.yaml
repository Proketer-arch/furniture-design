  - id: R-MOD-09
    title: "Пенал"
    rule: "«Глубина 560–600, ширина 400–600 (Р). Дверь на всю высоту или две двери — вариант заказа; на всю высоту — 4–5 петель по R-HNG-03 и проверка на коробление. Полки частого пользования — не выше 1900 над полом (Н); выше — только редко используемое.»"
    params:
      глубина: [560, 600]
      ширина: [400, 600]
      полка_max: 1900
    basis: [Р, Н]
    status: предложено
    src: [IS-04, IS-05, NR-01]
    afabrik: []
    needs: [высота пенала, масса двери]
    note: "«Отделение «две двери — граница на высоте» не нормируется источниками.»"

  - id: R-MOD-10
    title: "Пенал с выдвижной системой (SPACE TOWER и аналоги)"
    rule: "«Blum SPACE TOWER: нагрузка до 70 кг на ящик; фасад — петли по массе (4–6 кг, 6–12, 12–17, 17–22; значения даны для ширины 600); в верхнем уровне рекомендованы полки, а не ящики; возможны LEGRABOX, MERIVOBOX, TANDEMBOX, MOVENTO. Габариты по td-082 не читаются — внутренние размеры брать из документа при выборе (D-07). Аналоги Hettich и Boyard для пеналов выдвижного типа в источниках не найдены (D-08).»"
    params:
      нагрузка_ящика_кг: 70
      масса_фасада_кг: [[4, 6], [6, 12], [12, 17], [17, 22]]
    basis: [П]
    status: предложено
    src: [BL-09]
    afabrik: []
    needs: [td-082 (D-07)]
    note: "«Значения со звёздочкой на схемах td-082 получают +1 при установке направляющих до сборки корпуса.»"

  - id: R-MOD-11
    title: "Верхние модули"
    rule: "«Ряд высот: 360, 450, 576, 600, 720, 900, 960 (Р); для ниши под вытяжку и в зоне крупной техники высота не менее 360–400 (Р). Формат фасада — распашной, подъёмный (R-LFT-01), с ящиками (R-DRW-13) или открытая полка. Свободное пространство над навесными без антресоли 300–400 (Р).»"
    params:
      ряд_высот: [360, 450, 576, 600, 720, 900, 960]
      над_навесными: [300, 400]
    basis: [Р]
    status: предложено
    src: [IS-03, IS-04, IS-05, GL-10]
    afabrik: [K11, K19]
    needs: [высота потолка, размещение вытяжки]
    note: "«Высоты — каталог розничных источников; конкретный ряд фиксируется заказом.»"

  - id: R-MOD-12
    title: "Антресоль"
    rule: "«Антресоль — верхний ярус над рядом верхних модулей или над пеналом. Высота = потолок − верх ряда − технологический зазор. Выступающая антресоль: дно накладное; вровень с верхом: вкладное (K19, C12). Задняя стенка: накладная ХДФ или ЛДСП (K17); при типоне корпус заглубляется на 4 мм (K18 — гипотеза). Фасад: распашной, подъёмный или складной (R-LFT-09). При потолке выше 3000 решение «до потолка» принимать отдельно (Р).»"
    params:
      потолок_без_отдельного_решения_max: 3000
    basis: [И, Р]
    status: предложено
    src: [AF-01, IS-03]
    afabrik: [K14, K17, K18, K19, C04, C10, C12]
    needs: [высота потолка, уровень (C12)]
    note: "«Размеры антресоли — вопрос заказа; формулы фурнитуры из DRW/LFT работают на её LT и KH.»"

  - id: R-MOD-13
    title: "Добор и торцевая панель"
    rule: "«Добор между модулем и стеной: W_добора = замеренный зазор − g, где g — зазор до соседнего фасада (1,5) и до стены по условию установки; добор сначала проверять на возможность установки петли и ручки (по паспорту). Торцевая панель закрывает видимый торец; её кромка и толщина — по карте видимости (K04, C11).»"
    params:
      g: 1.5
    calc:
      - {name: "добор при замеренном зазоре 118", expr: "gap - g", vars: {gap: 118, g: 1.5}, expect: 116.5}
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K04, K06, C08, C11]
    needs: [замер зазора]
    note: "«Минимальную ширину добора источники не определяют (D-09).»"

  # ===================== JNC: углы и стыки =====================
  - id: R-JNC-01
    title: "Типы угловых решений"
    rule: "«Нижний угол: (1) прямой угол из двух модулей встык со слепой зоной; (2) L-образный модуль (задние стенки у двух стен); (3) трапециевидный; (4) карусель; (5) «волшебный уголок» (выдвижные корзины); (6) угловые ящики SPACE CORNER. Верхний угол: прямой, L-образный, трапециевидный. Тип выбирать до расстановки соседних модулей.»"
    basis: [Р, П]
    status: предложено
    src: [IS-05, BL-07, BL-08]
    afabrik: [K05]
    needs: [планировка, наполнение угла]
    note: "«Источники не дают размера слепой зоны (глубина), его считает R-JNC-02.»"

  - id: R-JNC-02
    title: "Слепая зона и первый доступный модуль"
    rule: "«В прямом угле ряд A доходит до угла, ряд B начинается на расстоянии D_полн(A) от стены. Длина слепого участка ряда A: L_слеп = D_полн(B) + h_ручки(B) + c, где c — зазор не менее 2. Первый доступный фасад ряда A начинается не ближе L_слеп; слепой модуль = L_слеп + W_доступной_части.»"
    params:
      c_min: 2
    calc:
      - {name: "L_слеп при D_полн(B)=579, h_ручки=30, c=2 (пример входных данных)", expr: "D + h + c", vars: {D: 579, h: 30, c: 2}, expect: 611}
      - {name: "слепой модуль с доступной частью 300", expr: "L + W", vars: {L: 611, W: 300}, expect: 911}
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K05, C03]
    needs: [D_полн ряда B, выступ ручки]
    note: "«Геометрическое правило. h_ручки = 0 для Gola. Значение 30 мм в примере — иллюстративный вход, не данные источника.»"

  - id: R-JNC-03
    title: "Проверка хода двери при открытии"
    rule: "«Для двери шириной W, открывающейся на угол α > 90°, вылет кромки в сторону соседнего ряда: d = W·sin(α − 90°). Свободное расстояние от оси петель до соседней плоскости фасада должно быть не меньше d + c. Для ящиков — не меньше ширины ящика в полностью выдвинутом положении до препятствия.»"
    calc:
      - {name: "d для W=600 и α=110°", expr: "W*sin(radians(a - 90))", vars: {W: 600, a: 110}, expect: 205.21}
      - {name: "d для W=450 и α=110°", expr: "W*sin(radians(a - 90))", vars: {W: 450, a: 110}, expect: 153.91}
    basis: [И]
    status: предложено
    src: [BL-16]
    afabrik: []
    needs: [угол открывания петли]
    note: "«Геометрия. Ограничитель угла (Blum 86° или 92°/110° по модели) снимает ограничение.»"

  - id: R-JNC-04
    title: "Размеры углового модуля"
    rule: "«Ориентиры: корпус 900×900 или фасады 1000 и 600; минимальная сторона 900–1000. Одна дверь углового модуля: нижнего до 500, верхнего до 300 (Р). Для SPACE CORNER ширина шкафа 900–1200, нагрузка до 65 кг, стандартные фасады через SYNCROMOTION.»"
    params:
      корпус_угла: [900, 1000]
      створка_низ_max: 500
      створка_верх_max: 300
      space_corner: {ширина: [900, 1200], нагрузка_кг: 65}
    basis: [Р, П]
    status: предложено
    src: [IS-03, IS-04, IS-05, BL-08]
    afabrik: [K05]
    needs: [выбор углового решения]
    note: "«Минимальная сторона: 900 (IS-05) и 1000 (IS-04) — принято 1000 как консервативное (X-15). Формулы SPACE CORNER из MA-493/0 в копии искажены (SKRWB1 = (LW − 75)·0,707 и др.) — только по оригиналу (D-10).»"

  - id: R-JNC-05
    title: "Угловые детали и технический угол"
    rule: "«Технический угол 34×34 (K05) хранить как параметр углового стыка до выяснения его назначения и положения (C09). Стыки столешницы в углу — с запасом под раскрой; бесстыковая длина постформинга ЛДСП до 4100 (Р). Цоколь в углу замыкается угловым элементом.»"
    params:
      технический_угол: [34, 34]
      постформинг_без_стыка_max: 4100
    basis: [И, Р]
    status: предложено
    src: [AF-01, IS-04]
    afabrik: [K05, C09]
    needs: [решение C09]
    note: "«Правило AFABRIK K05 не расшифровывается этой базой.»"

  - id: R-JNC-06
    title: "Стык модулей в ряду"
    rule: "«Соседние корпуса ставятся встык, каждый со своими боковинами; фронтальные плоскости и верх выравниваются по уровню; корпуса стягиваются между собой; цоколь и столешница общие. Общая боковина допустима только как вариант с пересчётом наложения (полунакладная, R-FRN-01).»"
    basis: [И]
    status: предложено
    src: [AF-01, MD-01]
    afabrik: [K06]
    needs: []
    note: "«Крепёж выбирается заказом (C02). Общий цоколь и столешница означают согласованную сборку, а не обязательно одну непрерывную деталь: сегменты, стыки и препятствия проверять по R-ASM-04, R-ASM-06.»"

  - id: R-JNC-07
    title: "Стык с пеналом и верхним рядом"
    rule: "«Фасадная плоскость пенала вровень с фасадами нижнего ряда (глубина пенала 560–600). Верхний ряд (D_полн 320 + t) стыкуется с боковиной пенала с проверкой хода двери (R-JNC-03). Над пеналом — антресоль (R-MOD-12).»"
    basis: [И, Р]
    status: предложено
    src: [IS-04]
    afabrik: [K11, K19]
    needs: []
    note: "«Согласовать фасадную и монтажную базы пенала с нижним рядом. Глубину внутренней видимой боковины/облицовки проверить по примыканию фартука и столешницы (R-ASM-02, R-ASM-03); совпадение глубины корпусов или наличие наружной декоративной панели стык не подтверждает.»"

  - id: R-JNC-08
    title: "Стык со стеной и боковым препятствием"
    rule: "«Распашная дверь у стены или перпендикулярной панели: расстояние берётся из таблицы петли (боковой зазор), для HK-XS у стены — 5. Если данных нет, выполнить макет двери с ручкой; не назначать зазор по догадке. Задний зазор 50 (K01) сохраняется для коммуникаций.»"
    params:
      hk_xs_боковой_зазор: 5
      задний_зазор: 50
    basis: [П, И]
    status: предложено
    src: [BL-12, AF-01]
    afabrik: [K01, C03]
    needs: [модель петли]
    note: "«Обработка плинтусов и бортика столешницы у фартука — по заказу (S2).»"

  # ===================== ISL: остров =====================
  - id: R-ISL-01
    title: "Проходы вокруг острова"
    rule: "«Проход между островом и рядом: минимум 1000, рекомендуется 1100–1200; 900 допускается только по явному подтверждению. Проход мерить между фасадами с ручками и с учётом открытых дверей техники (посудомоечная машина, духовка). Для двух работающих — 1200 (NKBA 48″ ≈ 1219); для одного — 1067 (42″).»"
    params:
      min: 1000
      рекомендовано: [1100, 1200]
      с_подтверждением: 900
      nkba: {один_повар: 1067, несколько: 1219}
    basis: [Р, Н]
    status: предложено
    src: [IS-01, IS-02, IS-04]
    afabrik: []
    needs: [планировка, габариты техники]
    note: "«Источники: IS-01 ≥1000, комфортно 1200; IS-04 минимум 900, оптимум 1200; IS-02 (NKBA) 42″/48″. Политика 1000 min (X-01).»"

  - id: R-ISL-02
    title: "Размеры острова"
    rule: "«Глубина острова с рабочей функцией — не менее 800; длина не менее 1200 (без посадки), рекомендовано от 1500. Глубина столешницы острова: D_ст = свес_раб + D_полн + t_панели + свес_посадки. Остров без рабочих зон и без посадки глубиной 600 допустим как полуостров — по решению.»"
    params:
      глубина_min: 800
      длина_min: 1200
      длина_рекомендована: 1500
    calc:
      - {name: "ширина помещения под рядом, островом и двумя проходами 1000", expr: "D + a1 + Disl + a2", vars: {D: 579, a1: 1000, Disl: 800, a2: 1000}, expect: 3379}
      - {name: "то же при проходах 1200", expr: "D + a1 + Disl + a2", vars: {D: 579, a1: 1200, Disl: 800, a2: 1200}, expect: 3779}
      - {name: "глубина столешницы острова, пример", expr: "s + D + t + o", vars: {s: 21, D: 579, t: 16, o: 300}, expect: 916}
    basis: [Р, И]
    status: предложено
    src: [IS-01, IS-05]
    afabrik: [C03]
    needs: [размеры помещения]
    note: "«Глубина: IS-01 — от 800; IS-05 — столешница 600–800 (X-15). Длина: IS-01 от 1500, IS-05 от 1200.»"

  - id: R-ISL-03
    title: "Свес и посадка"
    rule: "«Свес под посадку не менее 300; на место — около 600 ширины. Колени: при столешнице 760 — 457, при 914 (36″) — 381, при 1067 (42″) — 305 (NKBA); барная стойка 1050–1150. Свес сверх допустимого для материала столешницы — с опорой по паспорту материала (D-11).»"
    params:
      свес_min: 300
      место: 600
      колени_мм: {"760": 457, "914": 381, "1067": 305}
      барная_высота: [1050, 1150]
    calc:
      - {name: "число мест при длине свеса 1800", expr: "floor(L/600)", vars: {L: 1800}, expect: 3}
    basis: [Р, Н]
    status: предложено
    src: [IS-01, IS-02, IS-04]
    afabrik: []
    needs: [высота посадки, материал столешницы]
    note: "«Допустимый свес без опоры в источниках не указан.»"

  - id: R-ISL-04
    title: "Конструкция острова"
    rule: "«Остров собирается из тех же модулей, но с двумя видимыми сторонами: сторона посадки/прохода закрывается декоративной панелью или задней стенкой лицевого качества; карту видимости кромки (K04, C11) строить заново — открытых торцов у острова нет. Остров крепится к полу, а не держится массой (инженерная практика).»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K04, C11]
    needs: [карта видимости]
    note: "«Крепление к полу — не из источников; тип анкера задаёт заказ.»"

  - id: R-ISL-05
    title: "Функции на острове"
    rule: "«Компактный остров — одна активная функция (мойка или варка). Мойка и посудомоечная машина на острове напротив плиты — проверять открытые дверцы на столкновение. Вытяжка над варочной панелью — по документации; розетки — по схеме электрика.»"
    basis: [Р]
    status: предложено
    src: [IS-01, IS-02]
    afabrik: []
    needs: [паспорта техники, схема электрика]
    note: "«Числовых значений по этим пунктам в источниках нет.»"

  - id: R-ISL-06
    title: "Варианты примыкания острова"
    rule: "«Варианты: (1) свободный остров с проходами с двух сторон; (2) полуостров — торец касается ряда: против торца ряд недоступен, ширина недоступной части = глубина полуострова + 2·c, заменяется глухим модулем или панелью; (3) остров у пенала или стены с одним проходом: проход по R-ISL-01. В любом варианте проверить ход ящиков и дверей ряда напротив острова.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [C03]
    needs: [планировка]
    note: "«Геометрическое правило, аналогично R-JNC-02.»"

  # ===================== GLA: профиль Gola =====================
  - id: R-GLA-01
    title: "Профиль определяет геометрию"
    rule: "«Размеры профиля Gola берутся из документа выбранного поставщика, не из слова Gola (K02). Чертёж МДМ-Комплект недоступен (сайт закрыт для автоматического чтения), поэтому принят профиль Makmart GOLA Trend 4464 (горизонтальный, одно закругление, L-тип): сечение 26 × 56,5, длина 4200; закрытая заглушка 56,5 × 27,5, открытая 58 × 29; LED-вариант 5954 — 27 × 56,4. По схеме крепления Makmart гнездо в боковине имеет размеры 26, 37 и 57,5; профиль выступает вперёд от каркаса на 1 (Мебелькомплект: без выступа к 26 и 37 прибавить 1). Справочно из других источников: L — 27 × 56…58; C — 26 × 72,7…73; верхний — 18…20 × 38…42, внутренняя глубина верхнего профиля 19 (Emuca); длины поставки 2350 / 3900 (Emuca), 4000 (Würth), 4050 / 4100 (рынок); Мебелькомплект режет L и C длинами 1000 / 2000 / 3000 / 4100.»"
    params:
      makmart_4464_L: {ширина: 26, высота: 56.5, длина: 4200, выступ_вперёд: 1, заглушка_закрытая: [56.5, 27.5], заглушка_открытая: [58, 29]}
      makmart_5954_LED: {ширина: 27, высота: 56.4}
      L_справочно: {ширина: 27, высота: [56, 58]}
      C_справочно: {ширина: 26, высота: [72.7, 73]}
      верхний: {ширина: [18, 20], высота: [38, 42], внутренняя_глубина: 19}
      длины_поставки: [2350, 3900, 4000, 4050, 4100, 4200]
    basis: [П, Р]
    status: предложено
    src: [GL-01, GL-02, GL-03, GL-04, GL-05, GL-06, GL-08, GL-11]
    afabrik: [K02]
    needs: [чертёж профиля МДМ-Комплект (D-12)]
    note: "«X-16 закрыт в части геометрии L: Makmart 26 × 56,5 и Würth 27 × 56 отличаются не более чем на 1 мм; для расчёта высоты фасадов принят вычет 58 (решение владельца, равен высоте открытой заглушки). Сечение C-профиля в найденных листах Makmart не приведено — вычет 73 взят из решения владельца 18.10.2026. D-12 остаётся открытым для профиля МДМ.»"

  - id: R-GLA-02
    title: "Высоты фасадов с профилем"
    rule: "«Σh_фасадов S(n) = H_корп − 58 − 73·(n − 1) − 3, где n — число фасадов в модуле: 58 — L-профиль сверху, 73 — каждый C-профиль между фасадами, 3 — общий зазор («фасад = модуль − 3»). Не более 3 фасадов в Gola-модуле. При H_корп 760: n = 1 — 699; n = 2 — 626 (в среднем 313); n = 3 — 553 (184); при 740: 679 / 606 / 533. Вариант GOL-H: L сверху и push или TIP-ON на нижних ящиках — сумма фасадов 699 при 760. Зазор для пальцев между фасадами с профилем — 30–35 (30 достаточно, Р). Минимальную высоту фасада ящика брать из паспорта системы. Верхняя зона под L-профилем (58) недоступна: верхнюю полку ставить не выше H_внутр − 58.»"
    params:
      вычет_L: 58
      вычет_C: 73
      зазор_общий: 3
      n_макс: 3
      зазор_для_пальцев: [30, 35]
    calc:
      - {name: "S(3) при H_корп 760", expr: "H - 58 - 73*(n - 1) - 3", vars: {H: 760, n: 3}, expect: 553}
      - {name: "S(2) при H_корп 740", expr: "H - 58 - 73*(n - 1) - 3", vars: {H: 740, n: 2}, expect: 606}
      - {name: "S(1) при H_корп 760", expr: "H - 58 - 73*(n - 1) - 3", vars: {H: 760, n: 1}, expect: 699}
    basis: ["?", Р]
    status: предложено
    src: [GL-03, GL-07, GL-08, GL-11]
    afabrik: [K02, K06]
    needs: [чертёж профиля (D-12)]
    note: "«Формула — решение владельца 18.10.2026 (G3, G4). Расстановка профилей по Мебелькомплект: L — только сверху по лицевой кромке боковины (столы, полупеналы), C — между фасадами и между фасадом и фальшпанелью; в пеналах нижний уровень C стыкуется с нижним уровнем L столов; верхний фасад пенала открывается толкателем без профиля. 58 и 73 сверять с чертежом выбранного профиля.»"

  - id: R-GLA-03
    title: "Глубина модуля с Gola и длина ящика"
    rule: "«D_корп = 560 для семейств HND и GOL (решение владельца 18.10.2026); число 575 из K02 трактуется как 560 + 15 и хранится параметром Δ_Gola до чертежа профиля. D_полн(HND) = 560 + t_фасада; D_полн(GOL) = то же + выступ профиля (Makmart и Мебелькомплект — 1; по K02 — 15). Длина ящика: NL_max = внутренняя глубина − δ_G − Δ_сист, где δ_G = 27 (ширина профиля 26 + выступ 1). При внутренней глубине 544 (отступ задней стенки 12 + паз 4): 544 − 27 − 3 = 514, то есть NL 500 проходит у Blum. При корпусе 520 внутренняя глубина 504 даёт 474 — только NL 450. Пересчитать LT и NL (R-CAR-03) и свес столешницы (R-DIM-03).»"
    params:
      D_корп: 560
      Δ_Gola_K02: 15
      δ_G: 27
      внутр_глубина_560: 544
    calc:
      - {name: "внутренняя глубина при корпусе 560", expr: "560 - 12 - 4", vars: {}, expect: 544}
      - {name: "NL_max при корпусе 560, Blum (Δ=3)", expr: "d - dg - ds", vars: {d: 544, dg: 27, ds: 3}, expect: 514}
      - {name: "NL_max при корпусе 520, Blum (Δ=3)", expr: "d - dg - ds", vars: {d: 504, dg: 27, ds: 3}, expect: 474}
    basis: ["?", И, П]
    status: предложено
    src: [AF-01, GL-08, GL-11]
    afabrik: [K01, K02, C03]
    needs: [чертёж профиля (D-12), решение по C03 (Q-08)]
    note: "«δ_G = 27 подтверждена шириной профиля Makmart (26) и выступом 1 (Makmart, Мебелькомплект); закрытая заглушка занимает 27,5. Мебелькомплект применяет иную схему (корпус стола 510 внутр. и 578 у пеналов и верхних, корпус +60 по высоте); «корпус выше стандартного на 60» не принят: даёт 918 со столешницей 38 — вне ГОСТ 850–900 (X-16, X-23).»"

  - id: R-GLA-04
    title: "Зазоры и свес"
    rule: "«Свес столешницы над фасадом с Gola: 5 (прямая кромка) или 10 (постформинг) (форум, Р). Мебелькомплект выдвигает столешницу на 22 относительно каркаса — на уровень самого толстого фасада (ЛДСП 22): свес над фасадом при t фасада 19 равен 3, при 22 — 0. Свес над каркасом хранить параметром проекта; доступ пальцев к фасаду проверять отдельно. Верхний профиль Emuca: внутренняя глубина 19; рекомендуемый зазор 37; между дверью и профилем не менее 2 (только для профиля Emuca).»"
    params:
      внутренняя_глубина: 19
      зазор_рекомендован: 37
      до_двери_min: 2
      свес_над_фасадом: {прямая_кромка: 5, постформинг: 10}
      свес_над_каркасом_Мебелькомплект: 22
    calc:
      - {name: "свес над фасадом 19 при выносе 22 над каркасом", expr: "o - t", vars: {o: 22, t: 19}, expect: 3}
    basis: [П, Р]
    status: предложено
    src: [GL-01, GL-07, GL-08]
    afabrik: [K02]
    needs: [профиль]
    note: "«Значения Emuca относятся к его верхнему профилю; для другого профиля брать его паспорт. Ширина столешницы по решению 18.10.2026: g_стена + D_корп + t_фасада + свес (R-DIM-03).»"

  - id: R-GLA-05
    title: "Петли и ящики с Gola"
    rule: "«С горизонтальным профилем над дверью петля должна иметь ограничитель угла открывания 85°: Hettich Sensys и Sensys W90 (110° → 85°; обязателен, особенно при толщине фасада 17 мм и более — иначе открытая дверь повреждает кромку об профиль); Grass Tiomos — ограничение до 85°; Blum — по каталогу (86° / 92° / 110°). Push-механизм для фасадов с Gola не нужен: захват несёт профиль; на нижних ящиках варианта GOL-H допустим push или TIP-ON. Фасадный зазор при профиле определяется профилем, а не TIP-ON (X-18). Ящики: система и NL те же, длина — по R-GLA-03.»"
    params:
      угол_ограничителя: 85
    basis: [П, Р]
    status: предложено
    src: [BL-16, HT-04, GL-07, GL-08, GR-03]
    afabrik: [K02, K18]
    needs: [профиль, петля]
    note: "«Ограничитель Sensys 85° подтверждён руководством Мебелькомплект (GL-08, раздел 2): входит в комплект столов и пеналов с распашными дверями и горизонтальным профилем. Заглубление 4 при TIP-ON (K18) на Gola не переносится. Для 155° с ограничителем «полное раскрытие» теряется (R-HNG-09).»"

  - id: R-GLA-06
    title: "Длина профиля и сопряжения"
    rule: "«Профиль режется по сумме длин изделий в одной линейке без разрыва; Мебелькомплект поставляет L и C длинами 1000 / 2000 / 3000 / 4100 (с округлением вверх), Makmart — 4200. Припуск на рез в источниках не приведён (прежний ориентир 2–4 снят). Угол: рез 45° и уголок внутренний или внешний (Makmart AGP.8006-71A); торцы закрываются заглушками (закрытая 56,5 × 27,5, открытая 58 × 29); если рез на стыке неровный — допускается заглушка. Крепление: держатели SU116.DS59 (на шуруп 4 × 13) или SU136.DS59 (на бобышках).»"
    params:
      длины_нарезки: [1000, 2000, 3000, 4100]
    basis: [П]
    status: предложено
    src: [GL-02, GL-08, GL-11]
    afabrik: [K02, K05]
    needs: [инструкция выбранного профиля]
    note: "«Прежнее «припуск 2–4» приписывалось руководству Мебелькомплект, но в тексте редакции 2022.10 отсутствует — значение не подтверждено и убрано.»"

  - id: R-GLA-07
    title: "Ограничения Gola"
    rule: "«Gola не применять на радиусных, трапециевидных и угловых радиусных модулях, на торцевых скошенных и фигурных; для них допускается механизм «толкатель», кроме угловых радиусных (Р, Мебелькомплект). Фасады: 16 и 18 мм; 19 мм и более — блок до подтверждения поставщиком профиля (Мебелькомплект допускает ЛДСП 22, но для этой базы нужно подтверждение); при 17 мм и более ограничитель угла петли обязателен (R-GLA-05). Фасад из МДФ-эмали и МДФ в ПВХ: пеналы и колонны не изготавливаются, накладная декоративная боковая панель не применяется (виден белый тыл на участке выреза); плёнка ПВХ при зацепе за кромку может отслаиваться. ПММ и стиральную машину ставить только между столами (крайним — с дополнительной несущей панелью). Нужна точная кромка (GL-10).»"
    basis: [Р, "?"]
    status: предложено
    src: [GL-08, GL-10]
    afabrik: [K02, K04]
    needs: [подтверждение поставщика для фасадов 19 мм и более]
    note: "«Фасады 16 / 18 и блок 19+ — решение владельца 18.10.2026 (G9). Ограничения модулей — по разделам 2, 3, 3.10 руководства Мебелькомплект.»"

  - id: R-GLA-08
    title: "Высота проекта и пары H_корп + t"
    rule: "«Высота — свойство проекта: H_раб = 100 + H_корп + t (опора 100; ниже не использовать из-за ПММ), t ∈ {20, 40}. H_корп серии модулей должен совпасть с H_корп проекта, иначе блок; в одном непрерывном ряду нижних модулей — одно семейство или семейства с одинаковыми (H_корп, t). Рекомендованные пары с H_раб 880: HND — 740 + 40; GOL — 760 + 20 (Gola получает +20 мм корпуса за счёт тонкой столешницы). Ниша ПММ = 100 + H_корп (840 или 860; окно паспортов 820–865).»"
    params:
      опора: 100
      t_столешницы: [20, 40]
      пары_H_раб_880: {HND: [740, 40], GOL: [760, 20]}
    calc:
      - {name: "H_раб HND 740 + 40", expr: "100 + H + t", vars: {H: 740, t: 40}, expect: 880}
      - {name: "H_раб GOL 760 + 20", expr: "100 + H + t", vars: {H: 760, t: 20}, expect: 880}
      - {name: "ниша ПММ при H_корп 760", expr: "100 + H", vars: {H: 760}, expect: 860}
    basis: ["?", Н]
    status: предложено
    src: [AF-01, NR-01]
    afabrik: []
    needs: [допустимый свес столешницы 20 мм без опоры (D-11)]
    note: "«Решение владельца 18.10.2026 (G1, G2; закрывает X-21 и Q-01 по формуле). Подтверждённый стандарт РФ — постформинг 38 (R-DIM-04); столешница 20 мм по заявлению владельца 19.10.2026 — HPL либо монолитный акрил (поставщики не критичны: Ультрадекор, Kronospan, Interstone, Samsung, Ультраакрил и др.); допустимый свес без опоры — D-11. Мебелькомплект: корпус 780 при опоре 100 даёт 880 до плоскости корпуса, то есть 918 со столешницей 38 (X-16).»"

  - id: R-GLA-09
    title: "Верхние модули GOL"
    rule: "«Верхние модули GOL — врезной профиль J в нижний торец фасада (38–42 × 18–20, фрезеровка 10): корпус и нижняя полка не меняются. Накладной «Gola-шкаф» (профиль в нижнем горизонте; в Мебелькомплект горизонт короче на 20 + профиль) — опция: потеря глубины нижней полки ≈ 47 (20 + 27). Не применять к алюминиевой рамке и тонким фасадам без подтверждения. Для AVENTOS HK-XS в Gola-шкафах — только TIP-ON.»"
    calc:
      - {name: "потеря глубины нижней полки накладного Gola-шкафа", expr: "a + dg", vars: {a: 20, dg: 27}, expect: 47}
    basis: ["?", Р]
    status: предложено
    src: [GL-08, GL-11]
    afabrik: [K02, K19]
    needs: [подтверждение поставщика профиля J]
    note: "«Решение владельца 18.10.2026 (G6). Верхние модули Мебелькомплект глубиной 578 по каркасу делаются на уровне пеналов; в этой базе глубина верхнего модуля 320 (R-DIM-06).»"

  - id: R-GLA-10
    title: "Вертикальный Gola, угол и торцевая колонна"
    rule: "«Вертикальный Gola — только на торцах пеналов и колонн (под встроенный холодильник, распашные пеналы): вычет ширины фасада 27–35 по чертежу. Между нижними модулями вертикальных профилей нет: сплошной горизонтальный L или C. Угол: горизонтальный профиль проходит через угловой модуль на одном уровне с соседями (рез 45° и уголок); в слепой зоне угла h_ручки = 0, поэтому L_слеп = D_полн соседнего ряда + 0 + 2 (R-JNC-02). Торцевая колонна Gola (Мебелькомплект) — ширина 50; боковой профиль крепится через уголок внешний (L). К пеналу с вертикальным профилем со стороны профиля ПММ и стиральную машину не ставить — между ними нужен стол с каркасом.»"
    params:
      вычет_ширины_вертикальный: [27, 35]
      ширина_торцевой_колонны: 50
    basis: ["?", Р]
    status: предложено
    src: [GL-08, GL-10]
    afabrik: [K02, K05]
    needs: [чертёж вертикального профиля (D-12)]
    note: "«Решение владельца 18.10.2026 (G7, G8). Размеры колонны и ограничения соседства — раздел 3.9–3.10 руководства Мебелькомплект.»"

  # ===================== LAY: планировки и рецепты =====================
  - id: R-LAY-01
    title: "Порядок проектирования модульной кухни"
    rule: "«Двенадцать шагов: 1) исходные данные и обмер; 2) тип планировки и наличие антресоли; 3) выбор систем фурнитуры и профиля (адаптеры); 4) высоты (R-DIM-04, -05); 5) глубины и свесы (R-DIM-02, -03, -06); 6) угловые решения (R-JNC); 7) раскладка ширин по рядам (R-LAY-02); 8) верхний ряд по осям нижнего и вытяжка (R-DIM-09); 9) антресоль и подъёмники (R-MOD-12, R-LFT); 10) расчёт узлов: LW, LT, NL, ящики, петли, фасады; 11) проверки (12-checklists.md); 12) реестр допущений C/Q/D. Для проверок применять также R-ASM-09, R-ASM-10. Пропуск фиксировать как «не проверено»; допущение не заменяет приёмку обязательного узла.»"
    params:
      шаги: [исходные данные, тип планировки, системы фурнитуры, высоты, глубины, углы, раскладка ширин, верхний ряд, антресоль и подъёмники, расчёт узлов, проверки, реестр допущений]
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [C01, C02, C03, C04, C05, C06, C07, C08, C09, C10, C11, C12]
    needs: []
    note: "«Порядок согласован с процессом AFABRIK (бриф → модель → проверка → выпуск).»"

  - id: R-LAY-02
    title: "Раскладка ряда по ширинам"
    rule: "«Длина ряда L = Σ W_i + Σ W_добора. Сначала ставятся модули с фиксированной шириной (ниша техники, мойка, варочная панель), затем остаток набирается модулями из ряда (R-DIM-08) от больших к малым; остаток меньше минимального модуля — добор (R-MOD-13). Избегать более одного добора на ряд и добора у угла.»"
    calc:
      - {name: "ряд 3300: мойка 800, панель 600, холодильник 600, ПММ 600, остаток", expr: "L - (800 + 600 + 600 + 600)", vars: {L: 3300}, expect: 700}
    basis: [И]
    status: предложено
    src: [IS-05]
    afabrik: [K06]
    needs: [длина ряда, список техники]
    note: "«Пример иллюстративный; остаток 700 можно закрыть модулями 300 + 400 или 400 + 300.»"

  - id: R-LAY-03
    title: "Линейная кухня"
    rule: "«Один ряд нижних модулей и один верхних вдоль одной стены; мойка и варочная панель разнесены не менее чем на 400 (R-MOD-04); холодильник и пенал — на концах ряда; ряд без угла и без слепых зон; проход перед рядом по помещению. Антресоль — по R-MOD-12.»"
    basis: [И, Р]
    status: предложено
    src: [IS-03]
    afabrik: []
    needs: [длина стены]
    note: "«Линейный вариант — базовый: остальные планировки получаются добавлением угла (R-JNC) или острова (R-ISL).»"

  - id: R-LAY-04
    title: "Г-образная кухня"
    rule: "«Два ряда под 90° с углом по R-JNC-01. Выбрать, какой ряд доходит до угла, и пересчитать слепую зону по R-JNC-02. Длины рядов: L1 = стена 1, L2 = стена 2 − D_полн(ряд 1). Подбор модулей — R-LAY-02 для каждого ряда отдельно.»"
    calc:
      - {name: "L2 при стене 2 в 3000 и D_полн 579", expr: "wall - D", vars: {wall: 3000, D: 579}, expect: 2421}
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [K05, C03]
    needs: [стены, угловое решение]
    note: "«Если угловой модуль L-образный (задние стенки у двух стен), L2 считается от его габарита.»"

  - id: R-LAY-05
    title: "П-образная кухня"
    rule: "«Три ряда и два угла; расстояние между параллельными рядами в свету не менее суммы двух D_полн и прохода: W_пом ≥ D_полн1 + a + D_полн2, где a ≥ 1000 (R-ISL-01). Секции у плиты — 900–1200 (Р). Пеналы по 600 в количестве 2–3 (Р).»"
    calc:
      - {name: "ширина между рядами, проход 1000", expr: "D1 + a + D2", vars: {D1: 579, a: 1000, D2: 579}, expect: 2158}
    basis: [И, Р]
    status: предложено
    src: [IS-05]
    afabrik: [C03]
    needs: [размеры помещения]
    note: "«Проход между ногами П-образной — по политике R-ISL-01.»"

  - id: R-LAY-06
    title: "Кухня с островом или полуостровом"
    rule: "«Остров добавляется к линейной, Г- или П-образной планировке: проходы, размеры, посадка, примыкание — R-ISL-01…06; ширина помещения под одним рядом + остров — формула R-ISL-02. Ряд напротив острова проверять на столкновение дверей и ящиков.»"
    basis: [И]
    status: предложено
    src: [IS-01]
    afabrik: []
    needs: [размеры помещения]
    note: "«Если помещение не вмещает остров по R-ISL-01, остров исключается из планировки (JLC/NKBA: остров, не оставляющий проход двоим, убирается).»"

  - id: R-LAY-07
    title: "С антресолью и без"
