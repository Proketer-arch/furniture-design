  # ===================== SUP: фурнитура и рынок =====================
  - id: R-SUP-01
    title: "Не смешивать бренды в одном узле"
    rule: "«В одном узле (ящик + направляющая; петля + планка; подъёмник + фасад) использовать компоненты одного производителя и одной серии. Причины: различие креплений и ходов (medyn.su); Blum не отвечает за узлы EXPANDO T в сочетании с фурнитурой других производителей.»"
    basis: [П, Р]
    status: предложено
    src: [MK-02, BL-20]
    afabrik: []
    needs: []
    note: "«Допустимо сочетание разных брендов в разных узлах одного заказа (например, петли одного, ящики другого), если нет общей сопряжённой детали.»"

  - id: R-SUP-02
    title: "Нет адаптера — нет присадки"
    rule: "«Присадка, раскрой дна и задней стенки ящика и расчёт фасадов выпускаются только при заданном адаптере системы (R-DRW-01) и закрытых вопросах C02, C09. Смена системы пересчитывает зависимые детали, но не габариты модулей.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: [C02, C09, C07]
    needs: []
    note: "«Согласуется с правилом пакета AFABRIK о неполном брифе.»"

  - id: R-SUP-03
    title: "Приоритет документов"
    rule: "«Первичный документ производителя на точную серию и редакцию старше копий дилеров, форумов и каталогов магазинов. Если используется копия, в правиле ставится тег П (копия) и запись в D-реестр о сверке по оригиналу.»"
    basis: [И]
    status: предложено
    src: [AF-01]
    afabrik: []
    needs: []
    note: "«В базе копиями являются: BL-04, BL-05, BL-07, BL-10, BL-11, BL-12, BL-15…BL-17, BL-22, MD-01.»"

  - id: R-SUP-04
    title: "Рынок РФ: статус поставок фурнитуры"
    rule: "«Владелец подтвердил (19.10.2026): вся фурнитура Blum, Hettich, Salice, Grass и Italiana Ferramenta доступна и поставляется — ограничений по выбору этих брендов для проекта нет. Статус поставки хранится в справочнике адаптеров как «доступно (заявление владельца)» с датой; артикул и срок уточняются у поставщика при заказе. Историческая справка: 18-й пакет санкций ЕС (июль 2025) запретил ввоз ряда изделий, часть производителей перешла на китайские аналоги или локализацию, цены с 1 августа 2025 выросли на 35–40 % (Р); в обзоре 20-го пакета (апрель 2026) фурнитура не упомянута, перечень открытый (MK-08). Бренды в одном узле не смешивать (R-SUP-01).»"
    basis: [И, Р]
    status: предложено
    src: [MK-01, MK-02, MK-03, MK-04, MK-06, MK-08]
    afabrik: []
    needs: []
    note: "«Заменяет прежнюю формулировку «документального подтверждения устойчивых поставок Blum и Hettich нет»: D-13 закрыт заявлением владельца. Рыночные источники MK-01…MK-08 остаются справочными.»"

  - id: R-SUP-05
    title: "Функциональные аналоги"
    rule: "«Аналог подбирается по функции и классу нагрузки, не по размерам: ящик с двойной боковиной (Hettich ArciTech/Atira, Boyard START/MB, GTV Axis Pro) и с тонкой боковиной (Blum LEGRABOX, Hettich AvanTech YOU, Unihopper Magic Box); другие ящичные системы с адаптерами — Blum TANDEMBOX и MERIVOBOX, Grass Nova Pro Scala, Makmart SC; петли (Blum CLIP top, Hettich Sensys, Salice Silentia+, Grass Tiomos, Boyard EVO, Italiana Ferramenta Kimana); подъёмники (Blum AVENTOS, Hettich Lift Advanced, газлифты Boyard GL). Размерные формулы одного бренда на другой не переносить (R-SUP-01). Замена бренда = замена адаптера.»"
    basis: [И]
    status: предложено
    src: [BL-01, HT-01, BY-01, UH-01, GT-01, GR-01, SA-01]
    afabrik: []
    needs: []
    note: "«Складных фасадов типа HF вне Blum и Hettich в источниках нет (R-LFT-08). Разные константы у брендов подтверждают принцип адаптера: «CLIP top: 11 / 1,5 / −7» против «Salice Silentia+: 15 / 10 / 6 / −2» для накладной / полунакладной / вкладной (R-HNG-05, R-HNG-12).»"

  - id: R-SUP-06
    title: "Состав документов на систему"
    rule: "«На каждую выбранную систему получить: для ящиков — планировочный лист (LT/NL, дно, задняя стенка, EB, присадка, синхронизация); для петель — таблицы наложения, TB, зазоров, число по массе и высоте; для подъёмников — таблицы LF/массы, присадка, мин. глубина; для профиля — чертёж сечения и инструкция. Хранить редакцию и дату.»"
